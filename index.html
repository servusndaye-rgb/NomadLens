const D={"dims":["A","F","P","S","C"],"dim_names":{"A":"锚定","F":"流动","P":"驱力","S":"社交","C":"控制"},"scoring":{"method":"per_question_centering + cosine + archetype_bias","act_weights":[0.8,1.0,1.2,1.0],"key_weight":3.0,"interlude_weight":1.5,"note":"每题减去该题三选项向量均值；加权累加；与 archetypes[].vec 余弦匹配后加 archetypes[].bias 再排序。bias 抵消原型引力盆地大小不均，使结果分布均匀（热冷比 1.3×）。"},"acts":[{"id":1,"title":"断裂与启程","title_en":"Rupture","palette":{"bg":"#0a0908","accent":"#c8945a","accent2":"#e8b87a","glow":"rgba(200,148,90,0.07)","border":"rgba(200,148,90,0.12)"},"opening":"旋转门在你身后合上。玻璃里映出一个你还没认出的人。","closing":"引擎声把所有的重量压进座椅。你终于轻了。","shared":[{"scene":"工牌交回去的时候前台正在打电话，她冲你点了下头，继续讲。你走到电梯口才想起来，桌上那盆绿萝没带。","photo":"photo-1497366216548-37526070297c","gradient":"linear-gradient(160deg,#1a0e05,#2d1a0a 40%,#0a0604)","options":[{"text":"你折回去把绿萝抱走了。到楼下发现盆太大，塞不进包。","v":{"A":1.0,"C":0.3}},{"text":"算了。电梯来了。","v":{"F":0.8,"A":-0.5}},{"text":"你在电梯里发了条群消息，交接文档的链接，加一句「有事随时找我」。其实你已经想好了不会再回。","v":{"P":0.8,"C":0.6,"S":0.3}}],"art":"badge"},{"scene":"六位数。你算了三遍：房租、保险、吃饭。八个月。前提是不出任何意外。","photo":"photo-1460925895917-afdab827c52f","gradient":"linear-gradient(180deg,#06080c,#0a1018 40%,#040608)","options":[{"text":"你翻到一个两年没联系的旧客户，拨了出去。响到第五声你差点挂掉。","v":{"P":1.0,"S":0.4,"C":0.3}},{"text":"你在备忘录里列了逐月的支出上限，最后一行是个日期。","v":{"C":1.0,"P":0.5}},{"text":"你把屏幕按灭了。不想再看。","v":{"F":0.9,"C":-0.8}}],"art":"calc"},{"scene":"妈昨天的语音还亮着红点：「周末回来吃饭吗？炖了排骨。」出发前三天。你还没开口。","photo":"photo-1519608487953-e999c86e7455","gradient":"linear-gradient(200deg,#050810,#0a0f1a 40%,#030508)","options":[{"text":"你打电话回去，把存款、时间线、什么时候回来讲了一遍，像在述职。她听完只问了句「那你身份证带了吗」。","v":{"C":0.7,"P":0.5,"A":0.3}},{"text":"你发了条微信：「接了个项目要出去一阵。」然后把手机翻过去。","v":{"F":0.5,"S":-0.4,"A":-0.3}},{"text":"你答应了周末回去。饭桌上什么都没说，就是多添了两次饭。","v":{"A":0.8,"S":0.6}}],"art":"voice"},{"scene":"一点十七分。行李箱立在门口。楼下有人遛狗，指甲敲水泥地的声音一下一下传上来。","photo":"photo-1495197359483-d092478c170a","gradient":"linear-gradient(180deg,#04060e,#080c1a 40%,#020408)","options":[{"text":"你开灯把明天的流程又过了一遍，闹钟往前调了十分钟。","v":{"C":0.9,"P":0.4}},{"text":"你翻相册翻到最早那张。看完了，一张也没删。","v":{"A":0.7,"F":0.2}},{"text":"你睡着了。","v":{"F":0.7,"C":-0.5,"P":0.3}}],"art":"suitcase"}],"key":{"scene":"广播念了三遍航班号，不是你的。旁边小孩踢椅子腿，一下，一下。手机亮了，是发小：「真的走了？我还以为你说着玩的。」","is_key":true,"photo":"photo-1529074963764-98f45c47344b","gradient":"linear-gradient(170deg,#0e0c08,#141008 40%,#060504)","options":[{"text":"你把手机扣在腿上。等会儿再回。","v":{"F":1.5,"S":-0.8,"A":-0.3},"branch":"solo"},{"text":"你拨了回去。本来想说两句就挂，讲了二十分钟。最后你说：「帮我看着点我爸妈。」","v":{"A":1.2,"S":1.0},"branch":"bond"},{"text":"你打字打了一半删掉，改成语音，把落地时间、住哪、大概什么时候回来都说了一遍。发完才发现她根本没问这些。","v":{"P":0.8,"S":0.6,"C":0.4},"branch":"solo"}],"art":"gate"},"branches":{"solo":{"label":"独行线","questions":[{"scene":"云层盖上来之前，城市缩成一块灰绿色的板子。前排的婴儿哭了二十分钟了。","photo":"photo-1436491865332-7a61a109db05","gradient":"linear-gradient(180deg,#0a1020,#2a3050 40%,#1a1008)","options":[{"text":"你放下遮光板，戴上耳机。","v":{"F":0.8,"A":-0.6}},{"text":"你翻开本子写了到达后第一周要做的三件事。写到第二件的时候空姐来送餐。","v":{"P":0.9,"C":0.5}},{"text":"你要了一小瓶红酒。十一点的红酒，喝得有点急。","v":{"F":0.5,"S":-0.2,"C":-0.3}}],"art":"plane"},{"scene":"还有四十分钟。前排在收小桌板，塑料卡扣啪啪响。你的胃轻轻收紧了一下。","photo":"photo-1464037866556-6812c9d1c72e","gradient":"linear-gradient(180deg,#06080c,#0a0e18 40%,#040608)","options":[{"text":"接机、住处、SIM卡。你把它拆成清单，紧张就降级成了待办。","v":{"C":0.8,"P":0.6}},{"text":"到了再说。","v":{"F":0.9,"C":-0.6}},{"text":"你在那个目的地社群发了条：「各位好，今晚到，请多关照。」发之前改了两遍措辞，删掉了一个感叹号。","v":{"S":1.0,"P":0.3}}],"art":"tray"}],"narrative":"你把七年折成了一个登机箱的重量。过安检的时候没有人拦你。有那么一瞬间你觉得应该有人拦一下的，但没有。你穿过那道门，像穿过一层根本不存在的墙。机舱灯暗下来以后你才发现，攥着登机牌的手心是湿的。感情还在，你只是把它放到了行李架上。降落了再取。","recap":"你一个人过了安检，没有回头。起飞的时候你盯着窗外，看一座城市缩成一块电路板。","art":"cloud"},"bond":{"label":"牵绊线","questions":[{"scene":"起飞十分钟，手机振了一下。妈：「注意安全。」后面跟了个企鹅抱行李箱的表情包，像素都糊了。","photo":"photo-1436491865332-7a61a109db05","gradient":"linear-gradient(180deg,#080604,#100e0a 40%,#040302)","options":[{"text":"你回了个抱抱，然后关了消息通知。","v":{"A":0.5,"F":0.5,"C":0.3}},{"text":"你没回。截了图。","v":{"A":0.9,"C":0.2}},{"text":"你打了一大段，把落地时间、住哪、几点报平安都写清楚了。她要的是确定，你给得起。","v":{"S":0.7,"P":0.5,"C":0.5}}],"art":"chat"},{"scene":"有人在社群里说可以来机场接你。头像是张你不认识的脸。你们没见过。","photo":"photo-1464037866556-6812c9d1c72e","gradient":"linear-gradient(180deg,#06080c,#0a0e18 40%,#040608)","options":[{"text":"「太好了，一落地联系！」","v":{"S":1.0,"F":0.3}},{"text":"「不用麻烦。」欠人情这件事你还没准备好。","v":{"F":0.5,"C":0.5,"S":-0.5}},{"text":"你顺便问了三个问题：哪个SIM卡好、用什么打车软件、住处附近有没有超市。你要的是信息。","v":{"P":0.8,"C":0.5,"S":0.2}}],"art":"avatar"}],"narrative":"你走得很慢。倒也没犹豫，你是想把每一步都踩出声响来。登机口人群涌动的时候你回了一次头。没有在找谁，就是想最后闻一下这座机场：咖啡，免税店的香水，地板蜡。你的箱子比别人重三公斤。里面有些东西按克算，却压得最沉。你把根挖起来了，根上还裹着旧土。","recap":"你带着牵挂上了飞机。有人在登机口看你消失，有人在那头等你出现。你走得不快，每一步都踩实了。","art":"footprints"}},"art":{"open":"door"}},{"id":2,"title":"失重与着陆","title_en":"Freefall","palette":{"bg":"#080a0c","accent":"#5a8cc8","accent2":"#7ab0e8","glow":"rgba(90,140,200,0.06)","border":"rgba(90,140,200,0.12)"},"opening":"空气换了一种配方。你深吸一口，肺里全是你拼不出的味道。","closing":"你还没有地址，但你已经有了一张常坐的椅子。","shared":[{"scene":"超市的灯白得刺眼。洗发水瓶子上印着你看不懂的字。你习惯的那个牌子这里没有。","photo":"photo-1604719312566-8912e9227c6a","gradient":"radial-gradient(ellipse at 50% 50%,#141008,#060504)","options":[{"text":"随手拿了几样。不行再换。","v":{"F":0.8,"C":-0.4}},{"text":"你站在收银台前搜「附近中国超市」，搜到一家，四公里。","v":{"A":0.8,"S":0.3}},{"text":"你打开备忘录，把每天会用到的东西列了一遍，然后一样一样找本地替代品。列到第九样的时候冷气把你吹得手臂发凉。","v":{"C":0.9,"P":0.7}}],"art":"shelf"},{"scene":"第五天。凌晨两点的闹钟。客户在北京时间下午三点开会。屏幕亮起来的时候整个房间都是蓝的。","photo":"photo-1519389950473-47ba0277781c","gradient":"radial-gradient(ellipse at 50% 50%,#060a18,#020408)","options":[{"text":"你把作息整个翻过来。白天睡，夜里干。时差是入场费。","v":{"P":0.9,"C":0.5,"F":-0.2}},{"text":"你跟客户约了个双方都能忍的时段。谈了三轮，定在各自的边界上。","v":{"S":0.5,"P":0.5,"C":0.5}},{"text":"先熬着。没崩之前不改。","v":{"F":0.7,"C":-0.4,"P":0.3}}],"art":"alarm"},{"scene":"共享空间那个人又来了。这周第四次。你戴着降噪耳机，他在三米外朝你挥手。","photo":"photo-1497366811353-6870744d04b2","gradient":"radial-gradient(ellipse at 50% 50%,#0c1018,#040608)","options":[{"text":"第二天你换了张角落的桌子。","v":{"F":0.6,"S":-0.7}},{"text":"你摘下一只耳机说「今天有点忙」。他点点头走了，后来就没再来过。","v":{"C":0.5,"S":0.2,"P":0.3}},{"text":"你花二十分钟帮他装了个翻译工具，手把手教了一遍，还把常用词典的链接发给了他。他后来给你带过一次咖啡。","v":{"S":0.8,"P":0.7,"A":0.3}}],"art":"headphones"},{"scene":"巷子尽头一家很小的咖啡馆，院子里趴着只橘猫。你坐了一下午。傍晚老板端来一杯他自己烘的豆子，没收钱。","photo":"photo-1501339847302-ac426a4a7cbb","gradient":"radial-gradient(ellipse at 40% 60%,#1a1208,#060504)","options":[{"text":"你在地图上给它打了颗星。","v":{"A":0.9,"C":0.3}},{"text":"你拍了张照发到群里，配了定位。有三个人问在哪。","v":{"S":0.8,"P":0.3}},{"text":"你喝完就走了。没打卡，没拍照。这杯的味道不想让第二次毁掉。","v":{"F":0.8,"A":-0.5}}],"art":"cafe"}],"key":{"scene":"第十四天，天台上。日落把整座城市染成琥珀色。你已经有了常去的咖啡馆，认得三条回家的路。但今天一整天走神。","is_key":true,"photo":"photo-1477959858617-67f85cf4f1df","gradient":"linear-gradient(180deg,#0a0810,#1a1020 40%,#0a0808)","options":[{"text":"你打开手机看下一座城市的机票。","v":{"F":1.5,"A":-0.8},"branch":"drift"},{"text":"你打开租房软件搜月租。两周只是预告片。","v":{"A":1.2,"C":0.5},"branch":"settle"},{"text":"你打开项目文件夹开始理下阶段的活。去哪是其次，先把事情理顺。回过神的时候天已经黑透了。","v":{"P":1.0,"C":0.8},"branch":"drift"}],"art":"rooftop"},"branches":{"drift":{"label":"漂流线","questions":[{"scene":"对面坐着一个同样一个人在外面的人。喝到第三杯聊到了各自为什么走。分开时他在门口站了一下：「说不定下次在别的城市碰上。」","photo":"photo-1514933651103-005eec06c04b","gradient":"radial-gradient(ellipse at 40% 60%,#140c04,#060504)","options":[{"text":"你们加了微信。你知道你大概不会主动发消息。","v":{"F":0.8,"S":-0.2}},{"text":"你说「一定」。是认真的。","v":{"S":0.8,"A":0.5}},{"text":"回去后你把他提到的几座城市标在了地图上，还查了一下淡季机票。","v":{"P":0.7,"C":0.5}}],"art":"glasses"},{"scene":"凌晨三点，手机在枕边亮了。客户那边差十小时，消息标着 urgent，大写的。","photo":"photo-1519389950473-47ba0277781c","gradient":"radial-gradient(ellipse at 50% 50%,#060a18,#020408)","options":[{"text":"你爬起来开电脑。选了这种生活，时差税得认。","v":{"P":1.0,"C":0.6,"F":-0.2}},{"text":"「明早处理。」你把手机翻了个面。","v":{"F":0.9,"C":-0.7,"P":-0.4}},{"text":"你在群里@了个同时区的合作方：「帮我先顶一下？」然后翻身接着睡。第二天早上你请他喝了咖啡。","v":{"S":0.8,"P":0.5}}],"art":"bed"}],"narrative":"你像一滴水落在一个不吸水的台面上。完整，自足，随时会滚向下一个低处。你在这座城市留下的痕迹很轻：一家常去的店，一个没存进通讯录的名字，一条傍晚散步的路。你也留恋。你只是不想让留恋长成锚。","recap":"你把这座城市当中转站住。行李一直没完全打开，眼睛已经在看下一张地图。","art":"train"},"settle":{"label":"扎根线","questions":[{"scene":"按天太贵，签三个月能省一半。笔停在签名栏上面。你有多久没对任何地方承诺过九十天了。","photo":"photo-1502672260266-1c1ef2d93688","gradient":"linear-gradient(180deg,#0c0a06,#14110c 50%,#060504)","options":[{"text":"你签了。","v":{"A":1.0,"C":0.5,"F":-0.3}},{"text":"你改签了一个月。不想一次性把灵活性交出去。","v":{"F":0.5,"C":0.7,"P":0.3}},{"text":"签之前你花了两天踩点：附近的共享空间、健身房、快递点、最近的医院。你签的是接下来三个月的生活。","v":{"P":0.9,"C":0.8,"S":0.3}}],"art":"lease"},{"scene":"收银员认出你了。她用不太稳的英语笑着说：「Hello, same same?」扫码枪哔了一声。","photo":"photo-1604719312566-8912e9227c6a","gradient":"radial-gradient(ellipse at 50% 50%,#141008,#060504)","options":[{"text":"你胸口热了一下。被认出来这件事，你好久没有过了。","v":{"A":1.0,"S":0.7}},{"text":"你特意挑了几样没买过的放上传送带。","v":{"F":0.6,"A":-0.3,"C":-0.3}},{"text":"你顺嘴问她附近有没有中国超市。你想做一道要花椒和老抽的菜，已经想了两个星期。","v":{"A":0.6,"P":0.5,"S":0.4}}],"art":"scanner"}],"narrative":"你的根须在试探着往陌生的土里伸。没有谁宣布过「我要留下来」，那太隆重了。你就是一点一点把日子填满：一家咖啡馆，一个记得你名字的收银员，一条周六跑步的路线。用重复驯服陌生。等你反应过来，你已经有了一个地址。","recap":"你签了月租，有了常去的店、认得你脸的收银员、一条跑步路线。这个地方正从「住处」变成别的什么。","art":"key"}},"art":{"open":"belt"}},{"id":3,"title":"摩擦与裂痕","title_en":"Friction","palette":{"bg":"#0a0808","accent":"#c85a5a","accent2":"#e87a7a","glow":"rgba(200,90,90,0.06)","border":"rgba(200,90,90,0.12)"},"opening":"日子开始咬合了。齿轮磨齿轮，你听见了第一声嘎吱。","closing":"裂缝里透进了一点光。也可能是风。你分不清，反正你没有堵上它。","shared":[{"scene":"银行扣了信用卡年费。客服等了八分钟，声音隔着一个太平洋，每个字之间半秒延迟：「请本人携带身份证到柜台办理。」柜台在九千公里以外。","photo":"photo-1460925895917-afdab827c52f","gradient":"radial-gradient(ellipse at 50% 50%,#140c0c,#060404)","options":[{"text":"你挂了电话。有些事就是无解的。","v":{"F":0.5,"C":-0.4,"A":-0.3}},{"text":"你在家人群里发了句：「妈，帮我跑趟银行行吗？」五秒后她回了个「好」。","v":{"A":0.7,"S":0.8}},{"text":"你花了四十分钟把银行官网每个入口都点了一遍，最后在一个二级页面里找到了远程办理的入口，要传六份材料。","v":{"P":0.9,"C":0.7}}],"art":"bank"},{"scene":"有人问你做什么的。你说了。对方歪了下头：「哦，就是那种一边度假一边工作的？」","photo":"photo-1514933651103-005eec06c04b","gradient":"radial-gradient(ellipse at 40% 60%,#140c04,#060504)","options":[{"text":"你笑了笑，喝了一口。","v":{"F":0.7,"S":-0.5}},{"text":"你放下杯子，把客户、工时、凌晨三点都讲了一遍。讲到一半你听见自己的声音有点大。","v":{"P":0.6,"S":0.5,"C":0.4}},{"text":"「你见过度假的人凌晨三点改方案吗？」他笑了。你没有。","v":{"F":0.4,"P":0.5,"S":0.3}}],"art":"toast"},{"scene":"38.5。退烧药的拼写是 paracetamol，你盯着这个词看了一会儿。这座城市没有人会给你送粥。","photo":"photo-1519710164239-da123dc03ef4","gradient":"linear-gradient(180deg,#0a0808,#100c0a 40%,#060504)","options":[{"text":"你套上外套去了街角药店，比划了半天，拿到一板药。","v":{"F":0.6,"C":-0.4,"A":-0.6}},{"text":"你给妈打了视频。她一接就看出来了。你什么都没说，她也什么都没问。","v":{"A":1.0,"S":0.7,"F":-0.4}},{"text":"你在住客群里说了句「发烧了」。二十分钟后门口放着退烧药和一杯姜茶，没留名字。","v":{"S":1.0,"A":0.3}}],"art":"pill"},{"scene":"旧同事发了条朋友圈：升职了，西装照，评论区一片恭喜。你把评论区滑到了底。","photo":"photo-1519389950473-47ba0277781c","gradient":"radial-gradient(ellipse at 50% 50%,#0a0a14,#040408)","options":[{"text":"刺了一下。很快过去了。大概吧。","v":{"F":0.6,"A":-0.5,"C":-0.4}},{"text":"你发了句真心的祝贺，然后关了朋友圈入口。","v":{"S":0.7,"A":0.4}},{"text":"你打开自己的项目文件，把这个季度的进展重新算了一遍，算完发现比想象中好一点。","v":{"P":0.9,"C":0.8}}],"art":"feed"}],"key":{"scene":"周五晚上十一点。远处有音乐和笑声，声音到了，意思没到。没有谁排斥你，你们只是不在一个频率上。","is_key":true,"photo":"photo-1519710164239-da123dc03ef4","gradient":"linear-gradient(180deg,#0a0606,#100808 40%,#060404)","options":[{"text":"你穿好衣服出了门。不一定要找谁，但你想走在有人体温的空气里。","v":{"S":1.5,"F":0.4,"A":0.3},"branch":"toward"},{"text":"你关上窗，拉好窗帘。","v":{"F":1.0,"A":-0.5,"S":-0.8},"branch":"inward"},{"text":"你打开电脑开始干活。光标闪的节奏填满了房间，孤独找不到缝钻进来。干到两点半的时候你才想起来没吃晚饭。","v":{"P":1.2,"C":0.8,"S":-0.5},"branch":"inward"}],"art":"window_music"},"branches":{"toward":{"label":"趋人线","questions":[{"scene":"吧台是深色木头，杯底一圈一圈的水渍。旁边的人在跟酒保聊选举，看你在听，顺手把一杯啤酒推了过来。这里的人喝温啤酒。","photo":"photo-1514933651103-005eec06c04b","gradient":"radial-gradient(ellipse at 40% 60%,#140c04,#060504)","options":[{"text":"你用蹩脚的当地话说了声谢谢。然后他们开始教你骂人，你学了五个脏字，笑到呛酒。","v":{"S":1.2,"F":0.5,"A":0.3}},{"text":"你问他这里的选举到底在争什么。他讲了二十分钟，你听懂了一半，回去查了三个词。","v":{"P":0.6,"C":0.6,"S":-0.3}},{"text":"你喝完那杯就走了。","v":{"F":0.6,"S":-0.6,"C":-0.4}}],"art":"bar"},{"scene":"华人聚会在别人家的客厅。进门就闻到火锅底料。聊了两圈全是房价、签证和学区。有人递给你一杯茶，太烫了。","photo":"photo-1555396273-367ea4eb4db5","gradient":"radial-gradient(ellipse at 50% 50%,#141008,#060504)","options":[{"text":"你把茶喝完就走了。","v":{"F":0.6,"S":-0.3,"C":0.2}},{"text":"你找到另一个也靠着墙的人。你们在角落聊了一个多小时，声音被火锅的沸腾盖住。散场时她说下次带你去个更小的局。","v":{"S":0.9,"A":0.5}},{"text":"你加了组织者的微信。也许下次的主题更对味。","v":{"P":0.5,"S":0.6,"C":0.4}}],"art":"hotpot"}],"narrative":"裂痕出现的时候，你本能地往外伸手。去酒馆，去聚会，拨那个很久没打的号码。你清楚自己的电池型号，它得靠别人来充。可你也慢慢看出来了，在没有固定关系的世界里，每一次温暖都自带倒计时。你在学一件很难的事：被温暖，但别依赖它。","recap":"最难的时候你往人群里走了。去酒馆，去聚会，拨老朋友的号码。你的电池要靠别人充，但你没把充电器交出去。","art":"battery"},"inward":{"label":"内省线","questions":[{"scene":"你已经三天没跟人说过话了。第四天早上刷牙的时候你试着说了句「早上好」。声音有点沙。","photo":"photo-1519710164239-da123dc03ef4","gradient":"linear-gradient(180deg,#0a0808,#100c0a 40%,#060504)","options":[{"text":"你对着镜子笑了一下。","v":{"F":0.7,"S":-0.5,"C":-0.2}},{"text":"你给家里打了个电话。没什么事，就是想听见有人叫你的名字。","v":{"A":0.8,"S":0.6}},{"text":"你在本子上写了今天第一句话。写完又坐了一会儿，把那页折了个角。","v":{"P":0.6,"C":0.5,"A":0.2}}],"art":"mirror"},{"scene":"你开始用「距离上次跟人面对面说话过了几天」来算时间。今天是第六天。太阳照进来，落在一只空杯子上。","photo":"photo-1519710164239-da123dc03ef4","gradient":"linear-gradient(180deg,#080608,#0e0c10 40%,#040304)","options":[{"text":"你决定继续。你想知道自己能独处多久不碎。","v":{"F":0.8,"C":-0.5,"A":-0.6}},{"text":"你打开活动表报了明天的 workshop。不能再这样了。","v":{"S":0.7,"P":0.5,"A":0.3}},{"text":"你打开了一个很久没碰的项目。要独处，至少让它长出点什么来。那天夜里你写了四百行，第二天全删了，但心里松了。","v":{"P":1.0,"C":0.7,"S":-0.5}}],"art":"sunbeam"}],"narrative":"裂痕出现的时候，你把门关上了。也算不上逃，你在等它自己长好。用沉默代替倾诉，用独处代替求助。你发现修复系统是内置的。可一台永远在自我修复的机器，有时候只是不允许自己坏掉。这算坚强还是另一种回避，你分不清。你决定先把这段路走完再说。","recap":"最难的时候你把门关上了，用沉默把裂缝一点点消化掉。三天没说话，嗓子都生了锈。但你扛过来了。","art":"rain"}},"art":{"open":"crack"}},{"id":4,"title":"重力与选择","title_en":"Gravity","palette":{"bg":"#08090a","accent":"#7ac87a","accent2":"#a0e8a0","glow":"rgba(90,200,90,0.05)","border":"rgba(90,200,90,0.12)"},"opening":"你已经走了很远了。远到回头看的时候需要眯眼。","closing":"走到这里，你的坐标已经有了形状。地图上找不到它，但你知道它在哪。","shared":[{"scene":"旧公司 HR 来邮件：「有空聊聊？」你的位置空了半年，新组长指名要你，薪水涨三成。","photo":"photo-1497366811353-6870744d04b2","gradient":"radial-gradient(ellipse at 50% 50%,#0e1220,#04060c)","options":[{"text":"「谢谢，暂时不考虑。」手指没停。","v":{"F":0.9,"A":-0.7,"P":0.2}},{"text":"你没马上回。打开一张空表，把两边的收入、时间、五年后的样子逐项填进去，填到一半停住了。","v":{"P":0.8,"C":1.0}},{"text":"你把邮件转给一个朋友：「你怎么看？」","v":{"S":0.8,"A":0.4,"C":0.3}}],"art":"mail"},{"scene":"你和一个在这里认识的人之间有了点什么。不是爱情。有天下午你们在同一张桌上各干各的，两个小时没说话，但那种安静是有温度的。","photo":"photo-1506905925346-21bda4d32df4","gradient":"radial-gradient(ellipse at 50% 50%,#120a10,#060406)","options":[{"text":"你允许自己靠近。不提前预支「ta 可能会走」的疼。","v":{"S":0.9,"A":0.6,"F":0.3}},{"text":"你往后撤了半步。你的生活形状给不了任何人确定性。","v":{"F":0.7,"A":-0.5,"S":-0.4}},{"text":"你提议一起做个项目。你觉得把关系建在事情上比建在感情上耐久，虽然你没跟 ta 这么说过。","v":{"P":0.9,"S":0.5,"C":0.4}}],"art":"twolaptops"},{"scene":"有人问你：「你觉得哪儿是家？」他眼神很认真。你没接上话。","photo":"photo-1477959858617-67f85cf4f1df","gradient":"linear-gradient(180deg,#0a0810,#1a1020 40%,#0a0808)","options":[{"text":"「家是个动词。」","v":{"F":1.0,"A":-1.0,"C":-0.2}},{"text":"「有人等我的地方。」","v":{"S":0.9,"A":0.8}},{"text":"「我正在建一个。」你说完自己愣了一下，因为这句话你从来没跟别人说过，也没跟自己说过。","v":{"P":0.7,"A":0.4,"C":0.8}}],"art":"house"},{"scene":"给半年前的自己写一句话。笔尖碰到纸的时候你想了很久。","photo":"photo-1470252649378-9c29740c9fa8","gradient":"radial-gradient(ellipse at 40% 50%,#2a2010,#080604)","options":[{"text":"「你会失去很多。也会得到一些你现在连名字都叫不出来的东西。」","v":{"F":0.8,"A":-0.3}},{"text":"「别急着把线全剪断。」","v":{"A":0.9,"S":0.7}},{"text":"「记录，复盘，建系统。自由是一种能力，不是一种状态。」","v":{"P":1.0,"C":0.7}}],"art":"paper"}],"key":{"scene":"一封 offer。条件写得很清楚：固定城市，至少一年，每天打卡。它给你稳定、社保和一条看得见的路。代价是你得停下来。你在凌晨三点读完了整份合同。","is_key":true,"photo":"photo-1469474968028-56623f02e42e","gradient":"linear-gradient(180deg,#060a06,#102010 40%,#060504)","options":[{"text":"不。","v":{"F":1.5,"C":-1.0,"P":-0.3},"branch":"go"},{"text":"你想了三天。第三天下午签了。先攒资本，自由不急，急的是地基。","v":{"P":1.2,"C":1.0,"F":-0.3},"branch":"stay"},{"text":"你回了一封很长的邮件：远程、灵活排班、每季度一次长假。你不接受非此即彼。对方三天后才回，说可以谈。","v":{"P":0.8,"S":0.4,"C":0.5},"branch":"stay"}],"art":"contract"},"branches":{"go":{"label":"继续走","questions":[{"scene":"离开前一晚。几个月拍了上千张，大多数是某个路口、某碗面、某个人的背影。","photo":"photo-1519608487953-e999c86e7455","gradient":"linear-gradient(200deg,#050810,#0a0f1a 40%,#030508)","options":[{"text":"你全留着。","v":{"A":0.7,"F":0.3}},{"text":"你删掉了大部分。你不需要照片证明你来过。","v":{"F":0.9,"A":-0.6}},{"text":"你选了九张发了条朋友圈，配文一个字：「走。」发完两分钟内有十一个赞，你一个都没回。","v":{"S":0.5,"F":0.7,"P":0.2}}],"art":"photos"},{"scene":"在一张白纸上画你真的相信自己做得到的那种生活。窗外天正在亮。","photo":"photo-1501785888041-af3ef285b470","gradient":"linear-gradient(180deg,#08060a,#1a1408 30%,#2a2010 50%,#0a0808)","options":[{"text":"一个包，一台电脑，每三个月换座城市。你画了一条没有终点的线。","v":{"F":1.0,"A":-0.8,"S":-0.4,"C":-0.4}},{"text":"一个大本营，加上每年几次长途。你得有个能回的地方，才有胆子出发。","v":{"A":0.8,"F":0.3,"C":0.5}},{"text":"远程团队，分散在不同城市的几个深交，一套在哪都能启动的系统。你画了一张网，画完在角落写了个日期。","v":{"P":0.8,"S":0.6,"C":0.7}}],"art":"sketch"}],"narrative":"你选择了继续走。这里没有什么不好。你只是终于确认了自己的引擎型号：它烧的是移动本身。你在每座城市留下一点碎片，也从每座城市带走一点。你没有变成更好的人。你变成了更轻的人，轻到在任何风里都能起飞，轻到有时候你自己都抓不住自己。","recap":"稳定的机会摆在面前，你拒绝了。倒不是冲动，你确认了自己的引擎烧的是移动本身。你接着走了。","art":"road"},"stay":{"label":"停下来","questions":[{"scene":"签完走出办公室，自动门在身后合上。这个声音和几个月前辞职那天完全对称。走廊里有中央空调的味道。","photo":"photo-1497366811353-6870744d04b2","gradient":"radial-gradient(ellipse at 50% 50%,#0e1220,#04060c)","options":[{"text":"但这次是你自己选的。","v":{"A":0.9,"C":0.5,"F":-0.2}},{"text":"心里有点慌。怕那种被困住的感觉会从走廊尽头折回来。","v":{"F":0.5,"A":-0.3,"C":-0.4}},{"text":"你回家把合同条款又逐条过了一遍，重点看了离职通知期和竞业条款，然后拍照存了云。","v":{"C":1.0,"P":0.7}}],"art":"corridor"},{"scene":"有人在茶水间给你留了杯咖啡，你常喝的那种，杯壁还有热气。","photo":"photo-1497366811353-6870744d04b2","gradient":"radial-gradient(ellipse at 50% 50%,#0c1018,#040608)","options":[{"text":"被记住的感觉比你想象中好。你好久没有过「日常」了。","v":{"A":1.0,"S":0.7}},{"text":"你道了谢，但没坐下来聊。","v":{"F":0.5,"A":-0.3,"S":-0.4}},{"text":"你开始在团队里推旅居时学到的那套异步协作。第一次周会上没人接话，第三次有人主动问你要模板。","v":{"P":0.8,"S":0.5,"C":0.3}}],"art":"cup"}],"narrative":"你选择了停下来。没有走累，你只是终于找到了一个值得低头看看脚下的地方。你把路上学到的东西带了回来：更轻的行李，更清醒的判断，还有一个以前不知道自己有的能力，就是在任何地方都能活下去。你用这些，开始在一个固定的坐标上盖东西。你走了那么远，为的是知道什么时候该停。","recap":"你选择了停下来。走得动，只是终于找到了一个值得你花力气的地方。你用走远了才长出来的本事，开始在一个固定坐标上盖房子。","art":"bricks"}},"art":{"open":"fork"}}],"interludes":[{"id":"int1","after_act":1,"title":"间奏 · 空白","scene":"日历上什么都没有。没有会议，没有截止日期，没有必须去的地方。楼下有人在洗车，水冲在铁皮上，声音很规律。","options":[{"text":"你把这一天用完了。写完了一直想写的那个东西，收工的时候天黑了。","v":{"P":1.4,"C":0.7,"F":-0.2}},{"text":"你跳上一班不知道去哪的车。回来的时候鞋上全是土。","v":{"F":1.4,"C":-0.9,"P":0.2}},{"text":"你什么都没做。","v":{"P":-1.5,"S":-0.5,"F":-0.4}}],"art":"cal"},{"id":"int2","after_act":2,"title":"间奏 · 一件","scene":"明天要搬走，只能带一件。别管贵不贵，就是那件丢了会让你觉得这几个月白过的东西。窗外有摩托车滑过去。","options":[{"text":"一个记满了名字和事情的本子。有些字迹不是你的。","v":{"S":1.5,"A":0.6,"C":-0.4}},{"text":"那只用了三个月、杯口磨出光的杯子。你知道它该放在桌上哪个位置。","v":{"A":1.4,"C":1.2,"S":-0.5}},{"text":"什么都不带。","v":{"A":-1.4,"F":1.1,"C":-0.8}}],"art":"box"},{"id":"int3","after_act":3,"title":"间奏 · 三点","scene":"凌晨三点，你毫无预兆地醒了。冰箱在嗡嗡响，窗帘缝里漏进来一道路灯光。接下来三个小时没有人知道。","options":[{"text":"你打开电脑。天亮的时候屏幕上有了个能跑起来的东西。","v":{"P":1.5,"C":0.7,"S":-0.3}},{"text":"你下了楼。街上只有洒水车，和它身后那条湿的路。","v":{"F":1.3,"C":-1.1,"P":-0.4}},{"text":"你就那样醒着，什么也没想。","v":{"P":-1.6,"S":-0.6,"C":0.4}}],"art":"clock"},{"id":"int4","after_act":4,"title":"间奏 · 三年","scene":"有人给你出了道题：从明天起的三年，你可以完全自己安排，没有钱的问题。他问完就去接电话了，把你一个人留在这个问题里。咖啡凉了。","options":[{"text":"三年，一个地方。你想把它活穿，活到菜市场的人叫得出你名字。","v":{"A":1.4,"F":-1.5,"C":0.6}},{"text":"三年，十二个地方。每个都住到不看地图能走回住处。","v":{"F":1.4,"C":0.9,"A":0.3}},{"text":"三年，不知道几个地方。你不想现在就把它用掉。","v":{"F":1.1,"C":-1.4,"P":-0.4}}],"art":"hourglass"}],"archetypes":[{"id":"01","icon":"🕯️","name":"城市僧侣","catch":"大隐隐于市，极简匿名","vec":[0.54,-1.55,1.57,-0.58,1.87],"traits":["极简主义","匿名者","内在秩序"],"desc":"你没有逃离世界。你在世界正中间挖了一个洞，只有你自己知道入口。你住最吵的街区，没人叫得出你的名字。你的房间空得像一首俳句，留下的每一件东西都审过一遍。远方对你没什么吸引力，你要的是在近处消失的本事。你的自由叫隐身。","mode":"你在人最密的地方，活成了最安静的那一个。","collab":[{"id":"12","tag":"互补搭档","desc":"慢城炼药师能扎根，你能做减法。你们凑在一起，一个负责深，一个负责空。"},{"id":"06","tag":"灵魂知己","desc":"深海潜水者懂你的沉默。你们不说话的时候最亲。"}],"bias":-0.1737,"pos":[-0.623,-0.572]},{"id":"02","icon":"🌪️","name":"数字浪人","catch":"彻底流浪，抗拒规则","vec":[-1.29,1.88,-0.87,-0.93,-1.48],"traits":["反规则","永动机","无根者"],"desc":"所有原型里，你走得最远，停得最短。合同、租约、关系，甚至你自己的习惯，任何形式的固定你都躲。一旦发现自己开始「习惯」一个地方，你就知道该走了。你的自由很纯粹：随时可以不在这里。代价也很清楚，你在哪里都不算完全在。","mode":"你的护照比日记本厚。每一页写的都是同一句话：再见。","collab":[{"id":"09","tag":"旅伴","desc":"感官收集者和你一样活在当下。区别是你忘掉的风景，他替你记着。"},{"id":"07","tag":"锚点","desc":"部落点火人是你唯一愿意为之多待几天的理由。"}],"bias":-0.1567,"pos":[1.0,-0.029]},{"id":"03","icon":"⚗️","name":"数字炼金术士","catch":"极致高产，时区猎手","vec":[-0.35,-0.87,2.01,-0.65,1.92],"traits":["效率极客","系统建造者","独行侠"],"desc":"自由对你来说是原材料。你把它炼成生产力，把漂泊炼成竞争优势。你追时区差，为了拿到最长的工作窗口；你挑城市看网速和咖啡馆密度。你大概是最不浪漫的旅行者，也可能是活得最「成功」的那个。有个问题一直悬着：等你停下来那天，你还知道自己喜欢什么吗？","mode":"你把每一座城市都变成了一台替你运转的机器。","collab":[{"id":"08","tag":"效率联盟","desc":"荒原候鸟的迁徙系统配你的生产力引擎，两个人能把一年排成一张表。"},{"id":"11","tag":"远程搭档","desc":"隐形织网者的协作网络能让你的产出翻倍。"}],"bias":-0.1636,"pos":[-0.412,-0.78]},{"id":"04","icon":"👾","name":"赛博信徒","catch":"混沌美学，亚文化猎人","vec":[-1.21,1.84,-0.79,0.35,-1.84],"traits":["混沌美学","地下网络","跨界者"],"desc":"你不走主流路线。「最佳旅行目的地」你看都不看，你找的是每个城市最奇怪、最边缘、最不上攻略的角落：地下音乐现场，黑客空间，独立书店的地下室。你在几座城市之间织了一张亚文化的网。你的社交圈不大，但深到骨头里。","mode":"你的地图上标的全是每个城市最暗的那条巷子。","collab":[{"id":"09","tag":"感官同盟","desc":"感官收集者和你一样追不寻常的体验。他用鼻子，你用耳朵。"},{"id":"07","tag":"舞台搭建","desc":"部落点火人能把你挖到的地下场景，变成一个持续运转的社群。"}],"bias":0.0471,"pos":[0.911,0.234]},{"id":"05","icon":"🍯","name":"灵魂标本家","catch":"情感收藏家，深度倾听","vec":[1.64,-1.22,-0.78,2.05,-0.06],"traits":["倾听者","情感档案员","慢行者"],"desc":"你旅行的方式是坐下来，听一个人把他的一生讲完。你不赶路，不打卡，也不怎么拍照。你收集的是人的故事，每一段对话都像标本一样小心存起来。你行李箱里最重的东西，是一本写满了别人秘密的本子。你走得慢，走过的每一步都有分量。","mode":"你没在看世界。你在把世界听进去。","collab":[{"id":"07","tag":"情报网","desc":"部落点火人帮你找到那些值得听的人。"},{"id":"12","tag":"深度伙伴","desc":"慢城炼药师和你节奏一样，你们能在同一个地方待很久。"}],"bias":0.0527,"pos":[-0.463,0.662]},{"id":"06","icon":"🪨","name":"深海潜水者","catch":"极度内向，独处哲学家","vec":[-1.22,1.69,-1.35,-1.25,-1.12],"traits":["独处家","思考者","反效率"],"desc":"你出门，为了想得更多，看得多少倒无所谓。你挑最安静的城市，最偏的住处，人最少的时段出门。你每天的「产出」接近于零，可你心里那口井，水位一直在慢慢涨。所有原型里你最不焦虑，因为你从来没觉得自己需要「证明」什么。","mode":"你走得最远的那段路，全发生在你自己脑子里。","collab":[{"id":"01","tag":"灵魂共振","desc":"城市僧侣懂你的沉默。你们不说话的时候最亲。"},{"id":"05","tag":"翻译官","desc":"灵魂标本家能把你脑子里那些东西，翻译成别人听得懂的话。"}],"bias":-0.1058,"pos":[0.978,-0.045]},{"id":"07","icon":"🔥","name":"部落点火人","catch":"社群建设者，人脉节点","vec":[1.17,-0.97,0.3,2.56,-0.14],"traits":["连接者","组织者","部落领袖"],"desc":"你到任何地方，第一件事就是建群。你天生会把陌生人变成朋友，把朋友变成团队。你的旅行更像部落迁徙，走到哪里，哪里就长出一个小社区。你给别人归属感。你自己的归属感，来自被人需要。","mode":"你从来不是一个人在走。你是一堆移动的篝火。","collab":[{"id":"11","tag":"幕后搭档","desc":"隐形织网者在你看不到的地方，替你维护那些你点燃的群。"},{"id":"05","tag":"深度补充","desc":"灵魂标本家帮你看见那些没声音的人。"}],"bias":0.0011,"pos":[-0.486,0.52]},{"id":"08","icon":"🦅","name":"荒原候鸟","catch":"系统化迁徙，效率优先","vec":[-1.51,0.28,1.76,-1.28,1.38],"traits":["迁徙者","路线优化师","精确主义"],"desc":"你的移动像候鸟，沿一条算好的路线走。什么季节去什么城市，什么时区配什么工作，你都清楚。你的自由一点也不乱，它是一台运转精密的迁徙机器。你享受移动本身的效率感。只是偶尔会忘了，你飞越的除了距离，还有时间。","mode":"你的一年是一张地图，每个季节都有精确的坐标。","collab":[{"id":"03","tag":"效率联盟","desc":"数字炼金术士和你一样，把生活当系统来优化。"},{"id":"10","tag":"品质搭配","desc":"行宫皇帝负责让你每一站的生活质量不掉线。"}],"bias":0.17,"pos":[0.119,-0.928]},{"id":"09","icon":"🌈","name":"感官收集者","catch":"活在当下，体验至上","vec":[-0.96,1.89,-1.04,0.05,-1.85],"traits":["体验者","感官主义","反计划"],"desc":"你活在五感里。你记一座城市，靠的是某条街的气味，某家小店放的歌，某个黄昏的温度，名字和坐标反倒记不住。没有计划，没有目标，没有 KPI，就一个永远开着的感官系统。你是最快乐的旅行者，也是最不「成功」的。你不在乎。你活着的每一秒都是满的。","mode":"你的回忆里没有画面，只有一串气味和温度。","collab":[{"id":"04","tag":"探险伙伴","desc":"赛博信徒和你一样追不寻常的体验，你们总能找到别人找不到的地方。"},{"id":"02","tag":"同路人","desc":"数字浪人和你一样拒绝计划，你们在混乱里有默契。"}],"bias":0.0361,"pos":[0.936,0.257]},{"id":"10","icon":"🏰","name":"行宫皇帝","catch":"随处扎营，品质生活","vec":[2.45,-0.94,0.06,1.21,0.79],"traits":["品质主义","移动宫殿","安适者"],"desc":"你在每一个停留的地方，都快速搭起一座「行宫」。谈不上奢华，它是你自己定义的舒适：固定的咖啡杯，特定的枕头高度，自己带的锅。你走得不多，可你在每个地方都活得很好。你要的是密度，数量随它去。","mode":"你到哪里都能在三天之内，建成一个只属于你的王国。","collab":[{"id":"12","tag":"生活美学","desc":"慢城炼药师和你一样看重生活品质，只是他比你更愿意长期投入。"},{"id":"08","tag":"路线规划","desc":"荒原候鸟帮你找到最值得建行宫的下一站。"}],"bias":0.2627,"pos":[-0.651,0.376]},{"id":"11","icon":"🕸️","name":"隐形织网者","catch":"远程协作者，幕后推手","vec":[0.45,-1.63,1.61,1.26,1.39],"traits":["幕后者","远程大师","网络编织"],"desc":"你大概是最不像旅行者的旅行者。很少出门，很少社交，很少出现在任何人的雷达上。可你的影响力像蜘蛛网，悄悄铺到每一个角落。你靠屏幕连接世界，靠协作做出东西。数字时代最安静的赢家就是你这种人。没人看见你，所有人都离不开你。","mode":"你从不露面，可你到处都在。","collab":[{"id":"03","tag":"产出拍档","desc":"数字炼金术士的执行力，加上你的网络，可以撬动任何项目。"},{"id":"07","tag":"前台搭档","desc":"部落点火人在台前点火，你在幕后供氧。"}],"bias":0.0403,"pos":[-0.727,-0.215]},{"id":"12","icon":"🌿","name":"慢城炼药师","catch":"慢活主义，在地生根","vec":[2.07,-1.51,-0.78,1.28,0.44],"traits":["扎根者","在地主义","慢活家"],"desc":"你走了很远，最后选择停下来。没有走累，你找到了一个值得慢慢「炼」的地方。你学当地的话，逛当地的菜市场，认识每条小巷里的邻居。去更多地方对你没什么意义，你想把一个地方活到最深处。你是最慢的旅行者，也可能是唯一真正「到达」的人。","mode":"你用十年走完了别人一周的路。但你看见了他们看不见的东西。","collab":[{"id":"05","tag":"深度同盟","desc":"灵魂标本家和你一样相信慢有用。"},{"id":"01","tag":"哲学伙伴","desc":"城市僧侣在城市里做的事，和你在小镇里做的是同一件。你们是同一种人的两个版本。"}],"bias":0.1498,"pos":[-0.581,0.52]}],"proj":{"mu":[0.049374132088903226,-0.03093077816881426,0.047570476073425405,0.11361567321977546,0.036132248971214094],"W":[[-0.46999854311379324,0.607669378663123,-0.30377650540670603,-0.3002695823578268,-0.4768619384891515],[0.44143528440948887,-0.000529477343439178,-0.5417587187016525,0.5609252964141735,-0.4438410885502517]]},"baseline":{"A":{"mean":-0.44,"sd":12.19},"F":{"mean":1.27,"sd":15.29},"P":{"mean":0.21,"sd":11.92},"S":{"mean":1.46,"sd":11.68},"C":{"mean":-0.58,"sd":14.06}}};
const DE={"dims":["A","F","P","S","C"],"dim_names":{"A":"Anchor","F":"Flow","P":"Drive","S":"Social","C":"Control"},"scoring":{"method":"per_question_centering + cosine + archetype_bias","act_weights":[0.8,1.0,1.2,1.0],"key_weight":3.0,"interlude_weight":1.5,"note":"per-question centering; weighted sum; cosine match against archetypes[].vec plus bias, then sorted."},"acts":[{"id":1,"title":"Rupture","title_en":"Rupture","palette":{"bg":"#0a0908","accent":"#c8945a","accent2":"#e8b87a","glow":"rgba(200,148,90,0.07)","border":"rgba(200,148,90,0.12)"},"opening":"The revolving door closes behind you. In the glass, a reflection you haven't recognized yet.","closing":"The engine presses every ounce of weight into your seat. At last, you're light.","shared":[{"scene":"The receptionist is on the phone when you hand back your badge. She nods at you and keeps talking. You're at the elevator before you remember the pothos plant still on your desk.","photo":"photo-1497366216548-37526070297c","gradient":"linear-gradient(160deg,#1a0e05,#2d1a0a 40%,#0a0604)","options":[{"text":"You go back for it. Downstairs, you realize the pot's too big to fit in your bag.","v":{"A":1.0,"C":0.3}},{"text":"Forget it. The elevator's here.","v":{"F":0.8,"A":-0.5}},{"text":"In the elevator you send a group message, a link to the handover doc, plus \"reach me anytime.\" You already know you won't come back.","v":{"P":0.8,"C":0.6,"S":0.3}}],"art":"badge"},{"scene":"Six figures. You count three times: rent, insurance, food. Eight months. Assuming nothing goes wrong.","photo":"photo-1460925895917-afdab827c52f","gradient":"linear-gradient(180deg,#06080c,#0a1018 40%,#040608)","options":[{"text":"You dig up a client you haven't spoken to in two years and dial. By the fifth ring you almost hang up.","v":{"P":1.0,"S":0.4,"C":0.3}},{"text":"You write out a monthly spending ceiling in your notes. The last line is a date.","v":{"C":1.0,"P":0.5}},{"text":"You kill the screen. You don't want to look anymore.","v":{"F":0.9,"C":-0.8}}],"art":"calc"},{"scene":"Mom's voice message from yesterday still has a red dot: \"Coming home for dinner this weekend? I stewed pork ribs.\" Three days before you leave. You still haven't said anything.","photo":"photo-1519608487953-e999c86e7455","gradient":"linear-gradient(200deg,#050810,#0a0f1a 40%,#030508)","options":[{"text":"You call back and lay it all out, savings, timeline, when you'll return, like a status report. She listens, then asks only: \"Did you bring your ID?\"","v":{"C":0.7,"P":0.5,"A":0.3}},{"text":"You text: \"Took a project, going away for a while.\" Then you flip the phone face-down.","v":{"F":0.5,"S":-0.4,"A":-0.3}},{"text":"You say yes to the weekend. At dinner you say nothing, just take a second and third helping.","v":{"A":0.8,"S":0.6}}],"art":"voice"},{"scene":"1:17 a.m. The suitcase stands by the door. Someone's walking a dog downstairs; the click of its nails on the concrete drifts up, one beat at a time.","photo":"photo-1495197359483-d092478c170a","gradient":"linear-gradient(180deg,#04060e,#080c1a 40%,#020408)","options":[{"text":"You turn on the light and run through tomorrow's plan again, then set the alarm ten minutes earlier.","v":{"C":0.9,"P":0.4}},{"text":"You scroll the photo album back to the earliest one. You look at all of them. You delete none.","v":{"A":0.7,"F":0.2}},{"text":"You fall asleep.","v":{"F":0.7,"C":-0.5,"P":0.3}}],"art":"suitcase"}],"key":{"scene":"The PA reads a flight number three times. Not yours. The kid next to you kicks the chair leg, once, again. Your phone lights up, an old friend: \"You actually left? I thought you were joking.\"","is_key":true,"photo":"photo-1529074963764-98f45c47344b","gradient":"linear-gradient(170deg,#0e0c08,#141008 40%,#060504)","options":[{"text":"You lay the phone face-down on your thigh. You'll reply later.","v":{"F":1.5,"S":-0.8,"A":-0.3},"branch":"solo"},{"text":"You call back. You meant to say a few words and hang up; you talk for twenty minutes. At the end you say: \"Keep an eye on my parents for me.\"","v":{"A":1.2,"S":1.0},"branch":"bond"},{"text":"You type half a message, delete it, switch to voice, and lay out your landing time, where you'll stay, roughly when you'll be back. Only after sending do you realize she never asked any of that.","v":{"P":0.8,"S":0.6,"C":0.4},"branch":"solo"}],"art":"gate"},"branches":{"solo":{"label":"The Solo Line","questions":[{"scene":"Before the clouds close in, the city shrinks to a gray-green board. The baby in the row ahead has been crying for twenty minutes.","photo":"photo-1436491865332-7a61a109db05","gradient":"linear-gradient(180deg,#0a1020,#2a3050 40%,#1a1008)","options":[{"text":"You pull down the shade and put on your headphones.","v":{"F":0.8,"A":-0.6}},{"text":"You open your notebook and write the three things to do in your first week. You're on the second when the flight attendant brings the meal.","v":{"P":0.9,"C":0.5}},{"text":"You order a small bottle of red. Red wine at eleven in the morning, drunk a little too fast.","v":{"F":0.5,"S":-0.2,"C":-0.3}}],"art":"plane"},{"scene":"Forty minutes left. The row ahead is stowing tray tables, plastic latches clacking. Your stomach tightens a notch.","photo":"photo-1464037866556-6812c9d1c72e","gradient":"linear-gradient(180deg,#06080c,#0a0e18 40%,#040608)","options":[{"text":"Airport pickup, lodging, SIM card. You break it into a list, and the nerves downgrade into to-dos.","v":{"C":0.8,"P":0.6}},{"text":"Deal with it when I land.","v":{"F":0.9,"C":-0.6}},{"text":"You post to the destination group: \"Hi all, landing tonight, look forward to meeting you.\" You revised the wording twice and deleted one exclamation mark.","v":{"S":1.0,"P":0.3}}],"art":"tray"}],"narrative":"You folded seven years into the weight of a carry-on. No one stopped you at security. For a second you thought someone should have, but no one did. You walked through that gate like walking through a wall that was never there. Only after the cabin lights dimmed did you notice your palm, gripping the boarding pass, was damp. The feelings are still there. You just put them in the overhead bin. You'll take them down when you land.","recap":"You cleared security alone and didn't look back. At takeoff you stared out the window, watching a city shrink to a circuit board.","art":"cloud"},"bond":{"label":"The Tether Line","questions":[{"scene":"Ten minutes after takeoff, your phone buzzes. Mom: \"Stay safe.\" Followed by a penguin-hugging-a-suitcase sticker, the pixels all smeared.","photo":"photo-1436491865332-7a61a109db05","gradient":"linear-gradient(180deg,#080604,#100e0a 40%,#040302)","options":[{"text":"You send a hug back, then mute the notifications.","v":{"A":0.5,"F":0.5,"C":0.3}},{"text":"You don't reply. You screenshot it.","v":{"A":0.9,"C":0.2}},{"text":"You write a long message, spelling out landing time, where you'll stay, when you'll check in. What she wants is certainty, and that you can give.","v":{"S":0.7,"P":0.5,"C":0.5}}],"art":"chat"},{"scene":"Someone in the group offers to pick you up at the airport. The avatar is a face you don't know. You've never met.","photo":"photo-1464037866556-6812c9d1c72e","gradient":"linear-gradient(180deg,#06080c,#0a0e18 40%,#040608)","options":[{"text":"\"Amazing, I'll message you the second I land!\"","v":{"S":1.0,"F":0.3}},{"text":"\"No need, don't trouble yourself.\" Owing someone a favor is something you're not ready for.","v":{"F":0.5,"C":0.5,"S":-0.5}},{"text":"You slip in three questions: which SIM card is best, which ride app to use, whether there's a supermarket near the place. What you want is information.","v":{"P":0.8,"C":0.5,"S":0.2}}],"art":"avatar"}],"narrative":"You walked slowly. Not hesitating, exactly, you wanted every step to make a sound. When the crowd surged at the gate, you looked back once. Not searching for anyone, just wanting one last smell of that airport: coffee, duty-free perfume, floor wax. Your suitcase is three kilos heavier than everyone else's. Some of what's inside weighs almost nothing by the gram, yet presses down hardest. You pulled up your roots, and the roots still had the old soil on them.","recap":"You boarded carrying your attachments. Someone watched you disappear at the gate; someone waited for you to appear at the other end. You didn't walk fast, but every step landed solid.","art":"footprints"}},"art":{"open":"door"}},{"id":2,"title":"Freefall","title_en":"Freefall","palette":{"bg":"#080a0c","accent":"#5a8cc8","accent2":"#7ab0e8","glow":"rgba(90,140,200,0.06)","border":"rgba(90,140,200,0.12)"},"opening":"The air is mixed to a different recipe. You take one breath, and your lungs fill with something you can't spell.","closing":"You don't have an address yet, but you already have a chair you always sit in.","shared":[{"scene":"The supermarket lights are blinding white. The shampoo bottle is printed with words you can't read. The brand you're used to isn't here.","photo":"photo-1604719312566-8912e9227c6a","gradient":"radial-gradient(ellipse at 50% 50%,#141008,#060504)","options":[{"text":"You grab a few things at random. Swap them out if they don't work.","v":{"F":0.8,"C":-0.4}},{"text":"You stand at the register searching \"Chinese supermarket near me.\" One result, four kilometers away.","v":{"A":0.8,"S":0.3}},{"text":"You open your notes and list everything you use daily, then hunt down a local substitute for each. You're on the ninth when the AC leaves your arms cold.","v":{"C":0.9,"P":0.7}}],"art":"shelf"},{"scene":"Day five. Alarm at 2 a.m. The client meets at 3 p.m. Beijing time. When the screen lights up, the whole room turns blue.","photo":"photo-1519389950473-47ba0277781c","gradient":"radial-gradient(ellipse at 50% 50%,#060a18,#020408)","options":[{"text":"You flip your whole schedule. Sleep by day, work by night. The time difference is the price of admission.","v":{"P":0.9,"C":0.5,"F":-0.2}},{"text":"You book a slot both sides can tolerate. Three rounds of talks, settled on each other's edges.","v":{"S":0.5,"P":0.5,"C":0.5}},{"text":"Just tough it out. Don't change it until it breaks.","v":{"F":0.7,"C":-0.4,"P":0.3}}],"art":"alarm"},{"scene":"That guy at the coworking space is back. Fourth time this week. You've got noise-canceling headphones on; he's waving at you from three meters off.","photo":"photo-1497366811353-6870744d04b2","gradient":"radial-gradient(ellipse at 50% 50%,#0c1018,#040608)","options":[{"text":"The next day you move to a corner desk.","v":{"F":0.6,"S":-0.7}},{"text":"You lift one earcup and say \"a bit busy today.\" He nods and leaves. He never comes back.","v":{"C":0.5,"S":0.2,"P":0.3}},{"text":"You spend twenty minutes setting up a translation tool for him, walking him through it, and send him a link to a good dictionary. Later he brings you a coffee.","v":{"S":0.8,"P":0.7,"A":0.3}}],"art":"headphones"},{"scene":"A tiny café at the end of an alley, an orange cat asleep in the courtyard. You sit the whole afternoon. At dusk the owner brings out a cup of beans he roasted himself. No charge.","photo":"photo-1501339847302-ac426a4a7cbb","gradient":"radial-gradient(ellipse at 40% 60%,#1a1208,#060504)","options":[{"text":"You drop a star on it on the map.","v":{"A":0.9,"C":0.3}},{"text":"You take a photo and post it to the group with the location. Three people ask where it is.","v":{"S":0.8,"P":0.3}},{"text":"You finish and leave. No check-in, no photo. You don't want a second visit to ruin how this one tasted.","v":{"F":0.8,"A":-0.5}}],"art":"cafe"}],"key":{"scene":"Day fourteen, on the rooftop. Sunset dyes the whole city amber. You already have a regular café and know three ways home. But today your mind drifted all day.","is_key":true,"photo":"photo-1477959858617-67f85cf4f1df","gradient":"linear-gradient(180deg,#0a0810,#1a1020 40%,#0a0808)","options":[{"text":"You open your phone and look at flights to the next city.","v":{"F":1.5,"A":-0.8},"branch":"drift"},{"text":"You open a rental app and search monthly rents. Two weeks was only the trailer.","v":{"A":1.2,"C":0.5},"branch":"settle"},{"text":"You open the project folder and start sorting the next phase of work. Where to go is secondary; first, get things in order. When you come back to yourself, the sky is fully dark.","v":{"P":1.0,"C":0.8},"branch":"drift"}],"art":"rooftop"},"branches":{"drift":{"label":"The Drift Line","questions":[{"scene":"Across from you sits someone else out here alone. By the third drink you're talking about why you each left. Parting, he pauses at the door: \"Maybe we'll run into each other in some other city.\"","photo":"photo-1514933651103-005eec06c04b","gradient":"radial-gradient(ellipse at 40% 60%,#140c04,#060504)","options":[{"text":"You exchange contacts. You know you probably won't be the one to message first.","v":{"F":0.8,"S":-0.2}},{"text":"You say \"definitely.\" You mean it.","v":{"S":0.8,"A":0.5}},{"text":"Back home you mark the cities he mentioned on the map, and check off-season flights.","v":{"P":0.7,"C":0.5}}],"art":"glasses"},{"scene":"3 a.m., the phone lights up by your pillow. The client is ten hours off; the message is tagged URGENT, in caps.","photo":"photo-1519389950473-47ba0277781c","gradient":"radial-gradient(ellipse at 50% 50%,#060a18,#020408)","options":[{"text":"You get up and open the laptop. You chose this life; the time-zone tax has to be paid.","v":{"P":1.0,"C":0.6,"F":-0.2}},{"text":"\"I'll handle it in the morning.\" You flip the phone over.","v":{"F":0.9,"C":-0.7,"P":-0.4}},{"text":"You @ a collaborator in the same time zone: \"Can you cover for me first?\" Then you roll over and go back to sleep. Next morning you buy them a coffee.","v":{"S":0.8,"P":0.5}}],"art":"bed"}],"narrative":"You're like a drop of water on a surface that won't absorb it. Whole, self-contained, ready to roll toward the next low point. The marks you leave in this city are light: a regular shop, a name you never saved to contacts, an evening walking route. You feel the pull too. You just don't want the pull to grow into an anchor.","recap":"You lived in this city like a transit stop. Your bags never fully unpacked, your eyes already on the next map.","art":"train"},"settle":{"label":"The Rooting Line","questions":[{"scene":"By the day is too pricey; three months saves half. The pen hovers above the signature line. How long has it been since you promised any place ninety days?","photo":"photo-1502672260266-1c1ef2d93688","gradient":"linear-gradient(180deg,#0c0a06,#14110c 50%,#060504)","options":[{"text":"You sign.","v":{"A":1.0,"C":0.5,"F":-0.3}},{"text":"You change it to one month. You don't want to hand over all your flexibility at once.","v":{"F":0.5,"C":0.7,"P":0.3}},{"text":"Before signing you spend two days scouting: nearby coworking, gym, parcel point, closest hospital. What you're signing is the next three months of your life.","v":{"P":0.9,"C":0.8,"S":0.3}}],"art":"lease"},{"scene":"The cashier recognizes you. She smiles and says, in shaky English, \"Hello, same same?\" The scanner beeps.","photo":"photo-1604719312566-8912e9227c6a","gradient":"radial-gradient(ellipse at 50% 50%,#141008,#060504)","options":[{"text":"Something warms in your chest. Being recognized, you haven't had that in a long time.","v":{"A":1.0,"S":0.7}},{"text":"You deliberately put a few things you've never bought on the belt.","v":{"F":0.6,"A":-0.3,"C":-0.3}},{"text":"You ask offhand if there's a Chinese supermarket nearby. You've wanted to cook a dish that needs Sichuan peppercorns and dark soy for two weeks now.","v":{"A":0.6,"P":0.5,"S":0.4}}],"art":"scanner"}],"narrative":"Your roots are testing their way into unfamiliar soil. No one ever announced \"I'm staying,\" that would be too grand. You just fill the days in, bit by bit: a café, a cashier who remembers your name, a Saturday running route. Taming the strange with repetition. By the time you notice, you already have an address.","recap":"You signed a monthly lease, got a regular shop, a cashier who knows your face, a running route. This place is turning from \"where you stay\" into something else.","art":"key"}},"art":{"open":"belt"}},{"id":3,"title":"Friction","title_en":"Friction","palette":{"bg":"#0a0808","accent":"#c85a5a","accent2":"#e87a7a","glow":"rgba(200,90,90,0.06)","border":"rgba(200,90,90,0.12)"},"opening":"The days start to mesh. Gear against gear. You hear the first grinding note.","closing":"A little light comes through the crack. Or maybe it's a draft. You can't tell, and you didn't plug it.","shared":[{"scene":"The bank charged your card's annual fee. Eight minutes on hold with support, the voice an ocean away, half a second of lag between each word: \"Please visit a branch in person with your ID.\" The branch is nine thousand kilometers away.","photo":"photo-1460925895917-afdab827c52f","gradient":"radial-gradient(ellipse at 50% 50%,#140c0c,#060404)","options":[{"text":"You hang up. Some things just have no solution.","v":{"F":0.5,"C":-0.4,"A":-0.3}},{"text":"You post in the family group: \"Mom, can you make a trip to the bank for me?\" Five seconds later she replies \"sure.\"","v":{"A":0.7,"S":0.8}},{"text":"You spend forty minutes clicking through every entrance on the bank's site, and finally find remote processing buried in a second-level page, requiring six documents.","v":{"P":0.9,"C":0.7}}],"art":"bank"},{"scene":"Someone asks what you do. You tell them. They tilt their head: \"Oh, one of those people who works while on vacation?\"","photo":"photo-1514933651103-005eec06c04b","gradient":"radial-gradient(ellipse at 40% 60%,#140c04,#060504)","options":[{"text":"You smile and take a sip.","v":{"F":0.7,"S":-0.5}},{"text":"You put your glass down and lay it all out, clients, hours, 3 a.m. Halfway through you hear your own voice getting loud.","v":{"P":0.6,"S":0.5,"C":0.4}},{"text":"\"Ever seen someone on vacation rewriting a proposal at 3 a.m.?\" He laughs. You don't.","v":{"F":0.4,"P":0.5,"S":0.3}}],"art":"toast"},{"scene":"38.5°C. The fever medicine is spelled paracetamol; you stare at the word for a while. No one in this city will bring you congee.","photo":"photo-1519710164239-da123dc03ef4","gradient":"linear-gradient(180deg,#0a0808,#100c0a 40%,#060504)","options":[{"text":"You pull on a coat and go to the corner pharmacy, gesture for a while, come back with a blister pack.","v":{"F":0.6,"C":-0.4,"A":-0.6}},{"text":"You video-call Mom. She sees it the second she picks up. You say nothing, and she asks nothing.","v":{"A":1.0,"S":0.7,"F":-0.4}},{"text":"You post \"got a fever\" in the residents' group. Twenty minutes later there's fever medicine and a cup of ginger tea at your door. No name left.","v":{"S":1.0,"A":0.3}}],"art":"pill"},{"scene":"An old colleague posts: promoted, a photo in a suit, the comments full of congratulations. You scroll the comments to the bottom.","photo":"photo-1519389950473-47ba0277781c","gradient":"radial-gradient(ellipse at 50% 50%,#0a0a14,#040408)","options":[{"text":"It stings, a little. It passes quickly. Probably.","v":{"F":0.6,"A":-0.5,"C":-0.4}},{"text":"You leave a genuinely warm congratulations, then close the feed entirely.","v":{"S":0.7,"A":0.4}},{"text":"You open your own project files and recalculate this quarter's progress. It's a little better than you thought.","v":{"P":0.9,"C":0.8}}],"art":"feed"}],"key":{"scene":"Friday, eleven at night. Music and laughter in the distance, the sound arrives but the meaning doesn't. No one's shutting you out. You're just not on the same frequency.","is_key":true,"photo":"photo-1519710164239-da123dc03ef4","gradient":"linear-gradient(180deg,#0a0606,#100808 40%,#060404)","options":[{"text":"You get dressed and go out. Not necessarily to find anyone, but you want to walk in air with body heat in it.","v":{"S":1.5,"F":0.4,"A":0.3},"branch":"toward"},{"text":"You shut the window and draw the curtains.","v":{"F":1.0,"A":-0.5,"S":-0.8},"branch":"inward"},{"text":"You open the laptop and start working. The rhythm of the blinking cursor fills the room; loneliness can't find a crack to slip through. It's 2:30 before you remember you skipped dinner.","v":{"P":1.2,"C":0.8,"S":-0.5},"branch":"inward"}],"art":"window_music"},"branches":{"toward":{"label":"The Toward-People Line","questions":[{"scene":"The bar top is dark wood, ringed with water stains. The person beside you is talking politics with the bartender, sees you listening, and slides a beer over. People here drink their beer warm.","photo":"photo-1514933651103-005eec06c04b","gradient":"radial-gradient(ellipse at 40% 60%,#140c04,#060504)","options":[{"text":"You say thanks in broken local slang. Then they start teaching you how to swear; you learn five curse words and laugh until you choke on your drink.","v":{"S":1.2,"F":0.5,"A":0.3}},{"text":"You ask what the election is actually about. He talks for twenty minutes; you catch half, and look up three words when you get back.","v":{"P":0.6,"C":0.6,"S":-0.3}},{"text":"You finish that one and leave.","v":{"F":0.6,"S":-0.6,"C":-0.4}}],"art":"bar"},{"scene":"A Chinese gathering in someone's living room. You smell the hotpot base the moment you walk in. Two rounds of talk, all about property prices, visas, school districts. Someone hands you a cup of tea, too hot.","photo":"photo-1555396273-367ea4eb4db5","gradient":"radial-gradient(ellipse at 50% 50%,#141008,#060504)","options":[{"text":"You finish the tea and leave.","v":{"F":0.6,"S":-0.3,"C":0.2}},{"text":"You find another person also holding up a wall. You talk in the corner for over an hour, your voices buried under the boiling hotpot. Leaving, she says next time she'll take you to a smaller gathering.","v":{"S":0.9,"A":0.5}},{"text":"You add the organizer on WeChat. Maybe next time's theme fits better.","v":{"P":0.5,"S":0.6,"C":0.4}}],"art":"hotpot"}],"narrative":"When the crack appeared, you instinctively reached outward. To the bar, to the gatherings, to that number you hadn't dialed in ages. You know your own battery model; it has to be charged by other people. But you're slowly seeing it too: in a world without fixed relationships, every bit of warmth comes with its own countdown. You're learning something hard, to be warmed, without depending on it.","recap":"At the hardest point, you walked toward people. To the bar, to the gatherings, dialing an old friend's number. Your battery charges off others, but you never handed over the charger.","art":"battery"},"inward":{"label":"The Inward Line","questions":[{"scene":"You haven't spoken to anyone in three days. The fourth morning, brushing your teeth, you try saying \"good morning.\" Your voice is a little rough.","photo":"photo-1519710164239-da123dc03ef4","gradient":"linear-gradient(180deg,#0a0808,#100c0a 40%,#060504)","options":[{"text":"You smile at the mirror.","v":{"F":0.7,"S":-0.5,"C":-0.2}},{"text":"You call home. Nothing's wrong, you just want to hear someone say your name.","v":{"A":0.8,"S":0.6}},{"text":"You write the day's first sentence in your notebook. Then you sit a while and fold down the corner of the page.","v":{"P":0.6,"C":0.5,"A":0.2}}],"art":"mirror"},{"scene":"You've started measuring time by \"days since I last spoke to someone face to face.\" Today is day six. Sunlight comes in and lands on an empty cup.","photo":"photo-1519710164239-da123dc03ef4","gradient":"linear-gradient(180deg,#080608,#0e0c10 40%,#040304)","options":[{"text":"You decide to keep going. You want to know how long you can be alone without cracking.","v":{"F":0.8,"C":-0.5,"A":-0.6}},{"text":"You open the events list and sign up for tomorrow's workshop. This can't go on.","v":{"S":0.7,"P":0.5,"A":0.3}},{"text":"You open a project you haven't touched in ages. If you're going to be alone, at least let something grow out of it. That night you write four hundred lines, delete them all the next day, but something in you loosens.","v":{"P":1.0,"C":0.7,"S":-0.5}}],"art":"sunbeam"}],"narrative":"When the crack appeared, you shut the door. Not quite fleeing, you were waiting for it to heal on its own. Silence instead of confiding, solitude instead of asking for help. You found the repair system was built-in. But a machine that's always self-repairing sometimes just won't let itself break. Whether that's strength or another kind of avoidance, you can't tell. You decide to finish this stretch of road first, and figure it out later.","recap":"At the hardest point, you shut the door and digested the crack in silence, bit by bit. Three days without speaking, your voice gone rusty. But you carried it through.","art":"rain"}},"art":{"open":"crack"}},{"id":4,"title":"Gravity","title_en":"Gravity","palette":{"bg":"#08090a","accent":"#7ac87a","accent2":"#a0e8a0","glow":"rgba(90,200,90,0.05)","border":"rgba(90,200,90,0.12)"},"opening":"You've come a long way. Far enough that looking back means squinting.","closing":"By now, your coordinates have taken shape. You won't find them on any map, but you know where they are.","shared":[{"scene":"An email from your old company's HR: \"Free to chat?\" Your position's been empty six months, the new lead asked for you by name, thirty percent raise.","photo":"photo-1497366811353-6870744d04b2","gradient":"radial-gradient(ellipse at 50% 50%,#0e1220,#04060c)","options":[{"text":"\"Thanks, not considering it for now.\" Your fingers don't stop.","v":{"F":0.9,"A":-0.7,"P":0.2}},{"text":"You don't reply right away. You open a blank spreadsheet and fill in both sides, income, time, what five years out looks like, item by item. Halfway through, you stop.","v":{"P":0.8,"C":1.0}},{"text":"You forward the email to a friend: \"What do you think?\"","v":{"S":0.8,"A":0.4,"C":0.3}}],"art":"mail"},{"scene":"Something's grown between you and someone you met here. Not romance. One afternoon you're both working at the same table, two hours without a word, but the silence has warmth in it.","photo":"photo-1506905925346-21bda4d32df4","gradient":"radial-gradient(ellipse at 50% 50%,#120a10,#060406)","options":[{"text":"You let yourself get close. You don't pre-pay the ache of \"they might leave.\"","v":{"S":0.9,"A":0.6,"F":0.3}},{"text":"You step back half a pace. The shape of your life can't give anyone certainty.","v":{"F":0.7,"A":-0.5,"S":-0.4}},{"text":"You propose doing a project together. You figure a relationship built on work outlasts one built on feeling, though you never say that to them.","v":{"P":0.9,"S":0.5,"C":0.4}}],"art":"twolaptops"},{"scene":"Someone asks: \"Where do you think home is?\" His eyes are serious. You don't have an answer ready.","photo":"photo-1477959858617-67f85cf4f1df","gradient":"linear-gradient(180deg,#0a0810,#1a1020 40%,#0a0808)","options":[{"text":"\"Home is a verb.\"","v":{"F":1.0,"A":-1.0,"C":-0.2}},{"text":"\"Wherever someone's waiting for me.\"","v":{"S":0.9,"A":0.8}},{"text":"\"I'm building one.\" You surprise yourself saying it, because you've never said it to anyone, or to yourself.","v":{"P":0.7,"A":0.4,"C":0.8}}],"art":"house"},{"scene":"Write one line to the you of six months ago. When the pen touches the paper, you think for a long time.","photo":"photo-1470252649378-9c29740c9fa8","gradient":"radial-gradient(ellipse at 40% 50%,#2a2010,#080604)","options":[{"text":"\"You'll lose a lot. You'll also gain some things you can't even name yet.\"","v":{"F":0.8,"A":-0.3}},{"text":"\"Don't be in such a hurry to cut every line.\"","v":{"A":0.9,"S":0.7}},{"text":"\"Record, review, build systems. Freedom is an ability, not a state.\"","v":{"P":1.0,"C":0.7}}],"art":"paper"}],"key":{"scene":"An offer. The terms are spelled out clearly: fixed city, at least a year, clock in daily. It gives you stability, benefits, and a visible path. The price is that you stop. You read the whole contract at 3 a.m.","is_key":true,"photo":"photo-1469474968028-56623f02e42e","gradient":"linear-gradient(180deg,#060a06,#102010 40%,#060504)","options":[{"text":"No.","v":{"F":1.5,"C":-1.0,"P":-0.3},"branch":"go"},{"text":"You think for three days. The third afternoon, you sign. Build capital first; freedom can wait, it's the foundation that can't.","v":{"P":1.2,"C":1.0,"F":-0.3},"branch":"stay"},{"text":"You reply with a long email: remote, flexible hours, one long leave per quarter. You don't accept either-or. They take three days to answer, and say it's negotiable.","v":{"P":0.8,"S":0.4,"C":0.5},"branch":"stay"}],"art":"contract"},"branches":{"go":{"label":"Keep Moving","questions":[{"scene":"The night before leaving. Thousands of photos over the months, most of them some intersection, some bowl of noodles, the back of someone's head.","photo":"photo-1519608487953-e999c86e7455","gradient":"linear-gradient(200deg,#050810,#0a0f1a 40%,#030508)","options":[{"text":"You keep them all.","v":{"A":0.7,"F":0.3}},{"text":"You delete most of them. You don't need photos to prove you were here.","v":{"F":0.9,"A":-0.6}},{"text":"You pick nine and post them, captioned with one word: \"Go.\" Eleven likes in two minutes. You reply to none.","v":{"S":0.5,"F":0.7,"P":0.2}}],"art":"photos"},{"scene":"On a blank sheet, draw the kind of life you actually believe you can pull off. Outside the window, the sky is getting light.","photo":"photo-1501785888041-af3ef285b470","gradient":"linear-gradient(180deg,#08060a,#1a1408 30%,#2a2010 50%,#0a0808)","options":[{"text":"One bag, one laptop, a new city every three months. You draw a line with no endpoint.","v":{"F":1.0,"A":-0.8,"S":-0.4,"C":-0.4}},{"text":"A home base, plus a few long trips a year. You need a place to return to before you have the nerve to set out.","v":{"A":0.8,"F":0.3,"C":0.5}},{"text":"A remote team, a few close friends scattered across cities, a system that boots up anywhere. You draw a web, and write a date in the corner.","v":{"P":0.8,"S":0.6,"C":0.7}}],"art":"sketch"}],"narrative":"You chose to keep moving. Nothing was wrong here. You just finally confirmed the model of your own engine: it burns motion itself. You leave a fragment in every city, and take a fragment from each. You didn't become a better person. You became a lighter one, light enough to lift off in any wind, light enough that sometimes even you can't hold onto yourself.","recap":"A stable opportunity sat in front of you, and you turned it down. Not on impulse, you'd confirmed your engine burns motion itself. You kept walking.","art":"road"},"stay":{"label":"Come to a Stop","questions":[{"scene":"You sign, walk out of the office, the automatic door closing behind you. The sound is a perfect mirror of the day you quit, months ago. The corridor smells of central air.","photo":"photo-1497366811353-6870744d04b2","gradient":"radial-gradient(ellipse at 50% 50%,#0e1220,#04060c)","options":[{"text":"But this time you chose it yourself.","v":{"A":0.9,"C":0.5,"F":-0.2}},{"text":"There's a flicker of panic. That trapped feeling might come circling back from the end of the corridor.","v":{"F":0.5,"A":-0.3,"C":-0.4}},{"text":"You go home and go through the contract clause by clause again, focusing on the notice period and non-compete, then photograph it and save it to the cloud.","v":{"C":1.0,"P":0.7}}],"art":"corridor"},{"scene":"Someone left you a coffee in the break room, the kind you always drink, still steaming.","photo":"photo-1497366811353-6870744d04b2","gradient":"radial-gradient(ellipse at 50% 50%,#0c1018,#040608)","options":[{"text":"Being remembered feels better than you expected. You haven't had a \"daily routine\" in a long time.","v":{"A":1.0,"S":0.7}},{"text":"You say thanks, but you don't sit down to chat.","v":{"F":0.5,"A":-0.3,"S":-0.4}},{"text":"You start pushing the async workflow you learned on the road onto the team. At the first weekly meeting no one responds; by the third, someone asks you for the template.","v":{"P":0.8,"S":0.5,"C":0.3}}],"art":"cup"}],"narrative":"You chose to stop. Not because you were tired of walking, you just finally found a place worth looking down at your own feet for. You brought back what you learned on the road: lighter luggage, clearer judgment, and an ability you didn't know you had, the ability to survive anywhere. With these, you start building something on a fixed set of coordinates. You went that far to learn when to stop.","recap":"You chose to stop. Not because you couldn't keep going, you just found a place worth spending your strength on. With skills that only grew from going far, you start building a house on one fixed coordinate.","art":"bricks"}},"art":{"open":"fork"}}],"interludes":[{"id":"int1","after_act":1,"title":"Interlude · Blank","scene":"Nothing on the calendar. No meetings, no deadlines, nowhere you have to be. Someone's washing a car downstairs, water hitting sheet metal in a steady rhythm.","options":[{"text":"You used the whole day. Finished the thing you'd always meant to write; it was dark by the time you wrapped up.","v":{"P":1.4,"C":0.7,"F":-0.2}},{"text":"You jumped on a bus not knowing where it went. Your shoes were covered in dirt by the time you got back.","v":{"F":1.4,"C":-0.9,"P":0.2}},{"text":"You did nothing at all.","v":{"P":-1.5,"S":-0.5,"F":-0.4}}],"art":"cal"},{"id":"int2","after_act":2,"title":"Interlude · One Thing","scene":"You move out tomorrow, and can bring only one thing. Never mind the cost, just the one thing whose loss would make these months feel wasted. A motorbike slides past outside the window.","options":[{"text":"A notebook full of names and events. Some of the handwriting isn't yours.","v":{"S":1.5,"A":0.6,"C":-0.4}},{"text":"That cup you've used three months, its rim worn smooth. You know exactly where it goes on the desk.","v":{"A":1.4,"C":1.2,"S":-0.5}},{"text":"Bring nothing.","v":{"A":-1.4,"F":1.1,"C":-0.8}}],"art":"box"},{"id":"int3","after_act":3,"title":"Interlude · 3 a.m.","scene":"3 a.m., you wake with no warning. The fridge hums; a streetlight leaks through the gap in the curtains. The next three hours, no one will know about.","options":[{"text":"You open the laptop. By daybreak there's something on the screen that actually runs.","v":{"P":1.5,"C":0.7,"S":-0.3}},{"text":"You go downstairs. The street holds only a water truck, and the wet road behind it.","v":{"F":1.3,"C":-1.1,"P":-0.4}},{"text":"You just lie there awake, thinking of nothing.","v":{"P":-1.6,"S":-0.6,"C":0.4}}],"art":"clock"},{"id":"int4","after_act":4,"title":"Interlude · Three Years","scene":"Someone poses you a question: three years, starting tomorrow, entirely yours to arrange, money no object. Then he goes off to take a call, leaving you alone inside the question. The coffee's gone cold.","options":[{"text":"Three years, one place. You want to live it all the way through, until the people at the market know your name.","v":{"A":1.4,"F":-1.5,"C":0.6}},{"text":"Three years, twelve places. Each one lived in until you can find your way home without a map.","v":{"F":1.4,"C":0.9,"A":0.3}},{"text":"Three years, no idea how many places. You don't want to spend it now.","v":{"F":1.1,"C":-1.4,"P":-0.4}}],"art":"hourglass"}],"archetypes":[{"id":"01","icon":"🕯️","name":"The Urban Monk","catch":"Hidden in the loudest city, minimal and nameless","vec":[0.54,-1.55,1.57,-0.58,1.87],"traits":["Minimalist","The Anonymous","Inner Order"],"desc":"You didn't flee the world. You dug a hole right in the center of it, and only you know the entrance. You live in the noisiest district, and no one can name you. Your room is empty as a haiku; every object you kept has been vetted. Distance doesn't tempt you much, what you want is the skill of disappearing up close. Your freedom is called invisibility.","mode":"In the densest crowd, you became the quietest one.","collab":[{"id":"12","tag":"Complementary","desc":"The Slow-City Alchemist can put down roots; you can subtract. Together, one goes deep, one goes empty."},{"id":"06","tag":"Kindred Spirit","desc":"The Deep Diver understands your silence. You're closest when neither of you is speaking."}],"bias":-0.1737,"pos":[-0.623,-0.572]},{"id":"02","icon":"🌪️","name":"The Digital Ronin","catch":"Pure wandering, allergic to rules","vec":[-1.29,1.88,-0.87,-0.93,-1.48],"traits":["Anti-Rule","Perpetual Motion","The Rootless"],"desc":"Of all the archetypes, you go the farthest and stay the shortest. Contracts, leases, relationships, even your own habits, you dodge every form of the fixed. The moment you catch yourself \"getting used to\" a place, you know it's time to go. Your freedom is pure: you can always not be here. The cost is just as clear, you're never fully anywhere.","mode":"Your passport is thicker than your diary. Every page says the same word: goodbye.","collab":[{"id":"09","tag":"Travel Companion","desc":"The Sensory Collector lives in the present like you do. The difference is, the scenery you forget, they remember for you."},{"id":"07","tag":"Anchor Point","desc":"The Fire-Starter is the one reason you'd willingly stay a few extra days."}],"bias":-0.1567,"pos":[1.0,-0.029]},{"id":"03","icon":"⚗️","name":"The Digital Alchemist","catch":"Peak output, time-zone hunter","vec":[-0.35,-0.87,2.01,-0.65,1.92],"traits":["Efficiency Geek","System Builder","Lone Wolf"],"desc":"Freedom, to you, is raw material. You refine it into productivity, refine drifting into a competitive edge. You chase time-zone gaps for the longest work window; you pick cities by wifi speed and café density. You're probably the least romantic traveler, and possibly the most \"successful.\" One question hangs there: the day you finally stop, will you still know what you like?","mode":"You turned every city into a machine that runs for you.","collab":[{"id":"08","tag":"Efficiency Alliance","desc":"The Wilderness Migrant's migration system plus your productivity engine, together you can lay a whole year out on one spreadsheet."},{"id":"11","tag":"Remote Partner","desc":"The Invisible Weaver's collaboration network could double your output."}],"bias":-0.1636,"pos":[-0.412,-0.78]},{"id":"04","icon":"👾","name":"The Cyber Devotee","catch":"Chaos aesthetics, subculture hunter","vec":[-1.21,1.84,-0.79,0.35,-1.84],"traits":["Chaos Aesthetics","Underground Network","The Crossover"],"desc":"You don't take the mainstream route. \"Top travel destinations,\" you won't even glance at. What you hunt for is each city's strangest, most marginal, least guide-booked corners: underground gigs, hacker spaces, the basement of an indie bookshop. You've woven a subcultural web across a few cities. Your social circle isn't large, but it runs bone-deep.","mode":"Everything marked on your map is the darkest alley in each city.","collab":[{"id":"09","tag":"Sensory Alliance","desc":"The Sensory Collector chases the unusual like you do. They use their nose, you use your ears."},{"id":"07","tag":"Stage Builder","desc":"The Fire-Starter can turn the underground scenes you dig up into a community that actually keeps running."}],"bias":0.0471,"pos":[0.911,0.234]},{"id":"05","icon":"🍯","name":"The Soul Taxidermist","catch":"Collector of feeling, deep listener","vec":[1.64,-1.22,-0.78,2.05,-0.06],"traits":["The Listener","Archivist of Feeling","The Slow Walker"],"desc":"Your way of traveling is to sit down and listen to a person tell their whole life. You don't rush, don't check in, barely take photos. What you collect is people's stories, and every conversation is preserved carefully, like a specimen. The heaviest thing in your suitcase is a notebook full of other people's secrets. You walk slowly, and every step you've walked has weight.","mode":"You weren't looking at the world. You were listening it in.","collab":[{"id":"07","tag":"Intel Network","desc":"The Fire-Starter helps you find the people worth listening to."},{"id":"12","tag":"Deep Companion","desc":"The Slow-City Alchemist keeps your pace; the two of you can stay in one place a long time."}],"bias":0.0527,"pos":[-0.463,0.662]},{"id":"06","icon":"🪨","name":"The Deep Diver","catch":"Deeply inward, philosopher of solitude","vec":[-1.22,1.69,-1.35,-1.25,-1.12],"traits":["The Solitary","The Thinker","Anti-Efficiency"],"desc":"You go out to think more, and how much you see doesn't matter. You pick the quietest cities, the most remote lodgings, the emptiest hours to leave the house. Your daily \"output\" is close to zero, yet the well inside you keeps rising. Of all the archetypes you're the least anxious, because you never felt you had to \"prove\" anything.","mode":"The farthest stretch you've walked all happened inside your own head.","collab":[{"id":"01","tag":"Soul Resonance","desc":"The Urban Monk understands your silence. You're closest when neither of you is speaking."},{"id":"05","tag":"Translator","desc":"The Soul Taxidermist can translate what's in your head into words other people understand."}],"bias":-0.1058,"pos":[0.978,-0.045]},{"id":"07","icon":"🔥","name":"The Fire-Starter","catch":"Community builder, human hub","vec":[1.17,-0.97,0.3,2.56,-0.14],"traits":["The Connector","The Organizer","Tribe Leader"],"desc":"The first thing you do anywhere is start a group chat. You're a natural at turning strangers into friends and friends into a team. Your travel is more like a tribal migration, and wherever you go, a little community grows. You give other people a sense of belonging. Your own belonging comes from being needed.","mode":"You were never walking alone. You're a cluster of moving campfires.","collab":[{"id":"11","tag":"Backstage Partner","desc":"The Invisible Weaver maintains the groups you light, out of your sight."},{"id":"05","tag":"Depth Supplement","desc":"The Soul Taxidermist helps you see the people who make no noise."}],"bias":0.0011,"pos":[-0.486,0.52]},{"id":"08","icon":"🦅","name":"The Wilderness Migrant","catch":"Systematic migration, efficiency first","vec":[-1.51,0.28,1.76,-1.28,1.38],"traits":["The Migrant","Route Optimizer","The Precisionist"],"desc":"You move like a migratory bird, along a route you've worked out. Which city for which season, which time zone for which work, you know it all. Your freedom isn't chaotic at all, it's a precisely running migration machine. You enjoy the efficiency of motion itself. You just occasionally forget that what you're flying over, besides distance, is also time.","mode":"Your year is a map, each season with its exact coordinates.","collab":[{"id":"03","tag":"Efficiency Alliance","desc":"The Digital Alchemist, like you, optimizes life as a system."},{"id":"10","tag":"Quality Match","desc":"The Traveling Emperor makes sure the quality of life at each of your stops never drops."}],"bias":0.17,"pos":[0.119,-0.928]},{"id":"09","icon":"🌈","name":"The Sensory Collector","catch":"Living in the moment, experience above all","vec":[-0.96,1.89,-1.04,0.05,-1.85],"traits":["The Experiencer","The Sensualist","Anti-Planning"],"desc":"You live in your five senses. You remember a city by the smell of a certain street, the song in some little shop, the temperature of one dusk, while names and coordinates slip away. No plans, no goals, no KPIs, just a sensory system left permanently on. You're the happiest traveler, and the least \"successful.\" You don't care. Every second you're alive is full.","mode":"Your memories hold no images, only a string of smells and temperatures.","collab":[{"id":"04","tag":"Adventure Partner","desc":"The Cyber Devotee chases the unusual like you do; together you always find places no one else can."},{"id":"02","tag":"Fellow Traveler","desc":"The Digital Ronin refuses plans like you do; you have an easy rhythm inside the chaos."}],"bias":0.0361,"pos":[0.936,0.257]},{"id":"10","icon":"🏰","name":"The Traveling Emperor","catch":"Camp anywhere, live well everywhere","vec":[2.45,-0.94,0.06,1.21,0.79],"traits":["Quality First","Mobile Palace","The Comfort-Maker"],"desc":"In every place you stop, you quickly pitch a \"traveling palace.\" Not luxury, exactly, comfort as you define it: a fixed coffee cup, a specific pillow height, your own pot brought from home. You don't move much, but you live well everywhere you go. What you want is density; leave the numbers be.","mode":"Anywhere you land, within three days you've built a kingdom that's yours alone.","collab":[{"id":"12","tag":"Living Aesthetics","desc":"The Slow-City Alchemist values quality of life like you do, only they're more willing to commit long-term."},{"id":"08","tag":"Route Planning","desc":"The Wilderness Migrant helps you find the next stop most worth building a palace in."}],"bias":0.2627,"pos":[-0.651,0.376]},{"id":"11","icon":"🕸️","name":"The Invisible Weaver","catch":"Remote collaborator, the hand behind the scenes","vec":[0.45,-1.63,1.61,1.26,1.39],"traits":["The Backstage One","Remote Master","Web Weaver"],"desc":"You're probably the least traveler-like traveler. Rarely out, rarely social, rarely on anyone's radar. Yet your influence spreads like a spiderweb, quietly reaching every corner. You connect the world through a screen, and build things through collaboration. The quietest winner of the digital age is exactly your kind. No one sees you, and no one can do without you.","mode":"You never show your face, yet you're everywhere.","collab":[{"id":"03","tag":"Output Duo","desc":"The Digital Alchemist's execution, plus your network, can move any project."},{"id":"07","tag":"Front-of-House Partner","desc":"The Fire-Starter lights the fire out front; you supply the oxygen backstage."}],"bias":0.0403,"pos":[-0.727,-0.215]},{"id":"12","icon":"🌿","name":"The Slow-City Alchemist","catch":"Slow living, rooted in place","vec":[2.07,-1.51,-0.78,1.28,0.44],"traits":["The Rooted","Localist","Slow-Life Practitioner"],"desc":"You went far, and finally chose to stop. Not because you were tired, you found a place worth slowly \"refining.\" You learn the local language, wander the local market, get to know the neighbors down every alley. Going to more places means little to you; you want to live one place all the way to its depths. You're the slowest traveler, and possibly the only one who truly \"arrived.\"","mode":"You took ten years to walk what others walk in a week. But you saw what they couldn't.","collab":[{"id":"05","tag":"Deep Alliance","desc":"The Soul Taxidermist believes in slowness like you do."},{"id":"01","tag":"Philosophical Partner","desc":"What the Urban Monk does in the city is the same thing you do in a small town. You're two versions of the same kind of person."}],"bias":0.1498,"pos":[-0.581,0.52]}],"proj":{"mu":[0.049374132088903226,-0.03093077816881426,0.047570476073425405,0.11361567321977546,0.036132248971214094],"W":[[-0.46999854311379324,0.607669378663123,-0.30377650540670603,-0.3002695823578268,-0.4768619384891515],[0.44143528440948887,-0.000529477343439178,-0.5417587187016525,0.5609252964141735,-0.4438410885502517]]},"baseline":{"A":{"mean":-0.44,"sd":12.19},"F":{"mean":1.27,"sd":15.29},"P":{"mean":0.21,"sd":11.92},"S":{"mean":1.46,"sd":11.68},"C":{"mean":-0.58,"sd":14.06}}};

async function jp(p,b){const r=await fetch(API+p,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b||{})});if(!r.ok)throw new Error(r.status);return r.json();}
const NET={
 async session(){const r=await jp('/api/session');SID.set(r.sessionId);return r;},
 async step(choice){return jp('/api/step',{sessionId:SID.get(),choice});},

 canBack(){return S.n>0;},
};
const DIMS=D.dims,SC=D.scoring,TOTAL=32;function A(){return DATA().archetypes;}
const $=s=>document.querySelector(s);
const stage=$('#stage'),tint=$('#tint'),reelI=$('#reel i'),reelB=$('#reel b'),cut=$('#cut');
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;

/* ═══ 引擎（逐题重心化 + 加权累加 + 余弦 + bias） ═══ */
const toVec=o=>DIMS.map(k=>o.v&&o.v[k]!==undefined?o.v[k]:0);
const centered=q=>{const r=q.options.map(toVec),m=DIMS.map((_,j)=>r.reduce((s,v)=>s+v[j],0)/r.length);return r.map(v=>v.map((x,j)=>x-m[j]));};
const cos=(a,b)=>{let d=0,na=0,nb=0;for(let i=0;i<5;i++){d+=a[i]*b[i];na+=a[i]*a[i];nb+=b[i]*b[i];}return na&&nb?d/Math.sqrt(na*nb):0;};
const erf=x=>{const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+.3275911*x);return s*(1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-.284496736)*t+.254829592)*t*Math.exp(-x*x));};
const pct=(v,k)=>Math.round(100*.5*(1+erf((v-D.baseline[k].mean)/(D.baseline[k].sd*Math.SQRT2))));
function timeline(path){const s=[];DATA().acts.forEach((a,i)=>{const w=SC.act_weights[i];s.push({t:'open',a:i});a.shared.forEach((q,j)=>s.push({t:'q',a:i,q,w}));s.push({t:'q',a:i,q:a.key,w:w*SC.key_weight,key:1});const br=path[i];if(!br)return;s.push({t:'narr',a:i,br});a.branches[br].questions.forEach(q=>s.push({t:'q',a:i,q,w}));s.push({t:'close',a:i});s.push({t:'q',a:i,q:DATA().interludes.find(x=>x.after_act===a.id),w:SC.interlude_weight,il:1});});if(path.length===4)s.push({t:'result'});return s;}
function outcome(acc){const rk=A().map(a=>({a,s:cos(acc,a.vec)+(a.bias||0)})).sort((x,y)=>y.s-x.s);const[p,q]=rk,margin=p.s-q.s,n=Math.hypot(...acc)||1,u=acc.map(v=>v/n),c=u.map((v,j)=>v-D.proj.mu[j]);const xy=[0,1].map(r=>D.proj.W[r].reduce((s,w,j)=>s+w*c[j],0));return{p:p.a,q:q.a,margin,xy,pull:p.s/(p.s+q.s),verdict:margin>=.06?'locked':margin>=.02?'located':'liminal'};}

/* ═══ 本地引擎（演示模式用，与服务端逻辑等价） ═══ */
function localRender(st,answered){const a=DATA().acts[st.a];
 if(st.t==='result')return{kind:'result'};
 const base={progress:answered,total:TOTAL,act:a.id,palette:a.palette};
 if(st.t==='open')return{...base,kind:'act_open',title:a.title,title_en:a.title_en,text:a.opening,art:a.art.open};
 if(st.t==='narr')return{...base,kind:'branch_narrative',label:a.branches[st.br].label,text:a.branches[st.br].narrative,art:a.branches[st.br].art};
 if(st.t==='close')return{...base,kind:'act_close',text:a.closing};
 return{...base,kind:st.il?'interlude':'question',title:st.q.title||null,scene:st.q.scene,art:st.q.art||null,options:st.q.options.map(o=>o.text)};}
function localFree(acc){const o=outcome(acc);return{tier:'free',primary:{id:o.p.id,name:o.p.name,icon:o.p.icon,catch:o.p.catch},secondary:{id:o.q.id,name:o.q.name},verdict:o.verdict,pull:Math.round(o.pull*100),xy:o.xy.map(v=>+v.toFixed(3))};}
function localPaid(acc,path){const o=outcome(acc);const f=localFree(acc);
 return{...f,tier:'paid',primary:{...f.primary,mode:o.p.mode,desc:o.p.desc,traits:o.p.traits},

const MW=720,MH=470,PD=64,PX=104,cmp=x=>Math.sign(x)*Math.pow(Math.abs(x),.78),sx=x=>PX+((cmp(x)+1.05)/2.1)*(MW-PX*2),sy=y=>PD+((1.05-cmp(y))/2.1)*(MH-PD*2);

function place(stars,pid,qid,pull,proj){const P=stars.find(s=>s.id===pid),Q=stars.find(s=>s.id===qid);const dx=Q.x-P.x,dy=Q.y-P.y,L=Math.hypot(dx,dy)||1;const nx=-dy/L,ny=dx/L;
