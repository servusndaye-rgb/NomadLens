 const lines=[[p,'#E6DCC4',.9,.5],[q,'#9DB4D0',.5,.3]].map(([a,c,w,o])=>{const s=st(a.id);const L=Math.hypot(s.x-mx,s.y-my);return`<line x1="${mx}" y1="${my}" x2="${s.x}" y2="${s.y}" stroke="${c}" stroke-width="${w}" opacity="${o}" stroke-dasharray="${L}" stroke-dashoffset="${L}" style="animation:draw 1.6s ease 2s forwards"/>`;}).join('');
 const dots=stars.map(s=>{const P=s.id===p.id,Q=s.id===q.id,c=P?'#E6DCC4':Q?'#9DB4D0':'#3A404C';return`<g style="opacity:0;animation:in 1.2s ease ${.2+Math.random()*.9}s forwards"><circle cx="${s.x}" cy="${s.y}" r="${P?4.6:Q?3.4:2}" fill="${c}" opacity="${P||Q?1:.55}"/><text x="${s.x}" y="${s.up?s.y-13:s.y+21}" text-anchor="middle" font-size="${P||Q?13:11}" fill="${c}" opacity="${P||Q?1:.6}">${s.n}</text></g>`;}).join('');
 const paid=R.tier==='paid';
 const bars=(paid?Object.keys(R.dimNames):['A','F','P','S','C']).map(k=>{const v=paid?R.percentiles[k]:0;const nm=paid?R.dimNames[k]:DATA().dim_names[k];
  return`<div class="bar"><em>${nm}</em><div class="tr"><i data-w="${v}"></i><b data-l="${v}"></b><u></u></div><strong>${paid?v+'%':'—'}</strong></div>`;}).join('');
 const road=paid?R.road.map(s=>`<div class="road"><em>${T('actLabel')(s.act)} ${s.label}</em><p>${s.recap}</p></div>`).join(''):'';
 const mates=paid?R.collab.map(c=>`<div class="mate"><i>${c.icon}</i><div><h4>${c.name}<small>${c.tag}</small></h4><p>${c.desc}</p></div></div>`).join(''):'';
 const locked=`<div class="lock"><div class="blur" aria-hidden="true"><div class="sec"><div class="sh">${T('fiveDim')}</div>${bars}</div></div>
  <div class="cta"><button class="btn em" id="unlock">${T('cont')}</button></div></div>`;
 const n=await show(`<div class="res"><style>@keyframes draw{to{stroke-dashoffset:0}}@keyframes land{from{transform:translate(${sx(0)-mx}px,${sy(0)-my}px)}to{transform:none}}@keyframes glow{to{opacity:1}}</style>
  <div class="brand-slot">${T('brandSlot')}</div>
  <div class="vk">${V[verdict][0]}</div>
  <svg class="map" viewBox="0 0 ${MW} ${MH}" role="img" aria-label="${p.name} / ${q.name}">
   <line x1="${PD-24}" y1="${sy(0)}" x2="${MW-PD+24}" y2="${sy(0)}" stroke="rgba(160,180,210,.1)"/><line x1="${sx(0)}" y1="${PD-24}" x2="${sx(0)}" y2="${MH-PD+24}" stroke="rgba(160,180,210,.1)"/>
   <text x="${PD-30}" y="${sy(0)-10}" fill="#6E6A62" font-size="11" letter-spacing="2">${T('axisAnchor')}</text><text x="${MW-PD+30}" y="${sy(0)-10}" fill="#6E6A62" font-size="11" text-anchor="end" letter-spacing="2">${T('axisFlow')}</text><text x="${sx(0)+10}" y="${PD-28}" fill="#6E6A62" font-size="11" letter-spacing="2">${T('axisRel')}</text><text x="${sx(0)+10}" y="${MH-PD+34}" fill="#6E6A62" font-size="11" letter-spacing="2">${T('axisOut')}</text>
   ${lines}${dots}
   <g style="animation:land 2.4s cubic-bezier(.16,.84,.28,1) .4s both"><circle cx="${mx}" cy="${my}" r="17" fill="#E9A35B" fill-opacity=".07" style="opacity:0;animation:glow 1.6s ease 2.2s forwards"/><circle cx="${mx}" cy="${my}" r="7" fill="#E9A35B" fill-opacity=".17" style="opacity:0;animation:glow 1.6s ease 2s forwards"/><circle cx="${mx}" cy="${my}" r="3.2" fill="#E9A35B"/></g>
  </svg>
  <h1 class="rh">${head}</h1><p class="rn">${V[verdict][1]}</p>
  <div class="late"><div class="pull"><i id="pull"></i><b></b></div><div class="pl"><span>${T('gravity')(p.name,Math.round(pull*100))}</span><span>${T('gravity2')(q.name,Math.round(100-pull*100))}</span></div>
  <p class="mode">${p.catch}</p>
  ${paid?`<p class="mode" style="margin-top:34px">${p.mode}</p><p class="desc">${p.desc}</p><div class="traits">${p.traits.map(x=>`<span>${x}</span>`).join('')}</div>
  <div class="sec"><div class="sh">${T('fiveDim')}</div>${bars}<p style="font-size:12.5px;color:var(--ink3);margin-top:14px">${T('dimNote')}</p></div>
  <div class="sec"><div class="sh">${T('roadTitle')}</div>${road}</div>
  <div class="sec"><div class="sh">${T('matesTitle')}</div>${mates}</div>`:locked}
  <div class="qr-card"><img src="${QR_IMG_SRC}" onerror="this.onerror=null;this.src=QR_FALLBACK" alt="NomadLens" class="qr-img"/><div class="qr-text"><svg class="qr-logo" viewBox="0 0 100 100" aria-hidden="true"><path d="M22 54l14-13q4-3 8 0l6 4q4 2 9 1"/><path d="M42 42l14-18q3-4 6 0l18 26q4 6-2 12l-12 10q-6 4-8-1q-1-3 3-5l3-2"/><path d="M36 74l10-16l12 4l-4 12z"/><path d="M46 58l-2 16"/></svg><div class="qr-title">${T('qrTitle')}</div><div class="qr-brand">${T('qrBrand')}</div><div class="qr-sub">${T('qrSub')}</div></div></div>
  <div class="acts"><button class="btn em" id="share">${T('save')}</button><button class="btn" id="again">${T('again')}</button></div>
  <p class="foot">${T('footBrand')}</p></div></div>`);
 setTimeout(()=>{n.querySelector('#pull').style.width=Math.round(pull*100)+'%';n.querySelectorAll('.tr i').forEach(i=>i.style.width=i.dataset.w+'%');n.querySelectorAll('.tr b').forEach(b=>b.style.left=b.dataset.l+'%');},4200);
 setTimeout(chord,2000);
 const ub=n.querySelector('#unlock');
 if(ub)ub.onclick=async()=>{ub.disabled=true;ub.textContent=T('saving');
   try{const r=await IO.checkout();if(r.url){location.href=r.url;return;}RESULT=await IO.result();await result();}
   catch(e){ub.disabled=false;ub.textContent=T('cont');err(T('errStep'));}};
 n.querySelector('#again').onclick=()=>{sessionStorage.removeItem('nl4');location.reload();};
 n.querySelector('#share').onclick=share;
}

/* ═══ 分享图：1080×动态高度 竖版长图，canvas 直出，适配手机全屏浏览 ═══ */
async function share(){
 const b=$('#share');b.textContent=T('saving');
 try{
  try{await document.fonts.load('500 66px "Noto Serif SC"');await document.fonts.load('400 34px "Noto Serif SC"');await document.fonts.load('300 28px "Noto Serif SC"');}catch(e){}
  const R=window.__R,p=R.primary,q=R.secondary,xy=R.xy,pull=R.pull/100,verdict=R.verdict;
  // 中文按字符断行的辅助函数
  const mLines=(cx,tx,mw)=>{const cs=[...tx];let ln='',n=1;for(const ch of cs){const t=ln+ch;if(cx.measureText(t).width>mw&&ln){n++;ln=ch;}else ln=t;}return n;};
  const wText=(cx,tx,x,y,mw,lh)=>{const cs=[...tx];let ln='',cy=y;for(const ch of cs){const t=ln+ch;if(cx.measureText(t).width>mw&&ln){cx.fillText(ln,x,cy);ln=ch;cy+=lh;}else ln=t;}if(ln)cx.fillText(ln,x,cy);return cy;};
  // 用临时 ctx 测量 desc 需要几行，决定图片高度
  const tmp=document.createElement('canvas').getContext('2d');
  tmp.font='300 28px "Noto Serif SC"';
  const descLines=mLines(tmp,p.desc||'',900);
  // 版式关键 y 坐标
  const W=1080;
  const h=verdict==='locked'?T('shareHeadLocked')(p.name):verdict==='located'?T('shareHeadLocated')(p.name,q.name):T('shareHeadLiminal')(p.name,q.name);
  const catchY=985+h.length*88+24;
  const barY=catchY+80,barLabelY=barY+45,line2Y=barY+100;
  const modeY=line2Y+70,descY=modeY+90;
  const descEndY=descY+(descLines-1)*48;
  const traitsY=descEndY+70;
  // 图片高度：动态计算，上限 2540（小红书能完整展示的最大长图比例约 1:2.35）
  const H=Math.min(2540,traitsY+20+300);
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;const c=cv.getContext('2d');
  // 背景
  c.fillStyle='#07080a';c.fillRect(0,0,W,H);
  const g=c.createRadialGradient(W/2,520,40,W/2,520,700);g.addColorStop(0,'rgba(120,150,190,.09)');g.addColorStop(1,'rgba(7,8,10,0)');c.fillStyle=g;c.fillRect(0,0,W,H);
  // 星图
  const MW2=900,MH2=620,ox=90,oy=150,P2=70,PX2=120,X=x=>ox+PX2+((cmp(x)+1.05)/2.1)*(MW2-PX2*2),Y=y=>oy+P2+((1.05-cmp(y))/2.1)*(MH2-P2*2);
  const stars=deov(A().map(a=>({id:a.id,n:a.name,x:X(a.pos[0]),y:Y(a.pos[1])})),78);labelSides(stars);
  c.strokeStyle='rgba(160,180,210,.12)';c.lineWidth=1;c.beginPath();c.moveTo(ox+30,Y(0));c.lineTo(ox+MW2-30,Y(0));c.moveTo(X(0),oy+30);c.lineTo(X(0),oy+MH2-30);c.stroke();
  c.fillStyle='#6E6A62';c.font='300 20px "Noto Serif SC"';c.textAlign='left';c.fillText(T('axisAnchor'),ox+30,Y(0)-14);c.textAlign='right';c.fillText(T('axisFlow'),ox+MW2-30,Y(0)-14);c.textAlign='left';c.fillText(T('axisRel'),X(0)+14,oy+44);c.fillText(T('axisOut'),X(0)+14,oy+MH2-22);
  const me2=place(stars,p.id,q.id,pull,[X(xy[0]),Y(xy[1])]);const mx=me2.x,my=me2.y;
  for(const[id,col,w,a]of[[p.id,'#E6DCC4',1.6,.55],[q.id,'#9DB4D0',1,.35]]){const s=stars.find(x=>x.id===id);c.globalAlpha=a;c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(mx,my);c.lineTo(s.x,s.y);c.stroke();c.globalAlpha=1;}
  for(const s of stars){const P=s.id===p.id,Q=s.id===q.id,col=P?'#E6DCC4':Q?'#9DB4D0':'#3A404C';c.fillStyle=col;c.globalAlpha=P||Q?1:.6;c.beginPath();c.arc(s.x,s.y,P?8:Q?6:3.5,0,7);c.fill();c.font=`${P||Q?500:300} ${P||Q?24:20}px "Noto Serif SC"`;c.textAlign='center';c.fillText(s.n,s.x,s.up?s.y-22:s.y+40);c.globalAlpha=1;}
  for(const[r,a]of[[30,.07],[13,.18],[6,1]]){c.fillStyle='#E9A35B';c.globalAlpha=a;c.beginPath();c.arc(mx,my,r,0,7);c.fill();}c.globalAlpha=1;
  // 分隔线 + verdict + 头字 + catch
  c.strokeStyle='rgba(236,232,223,.12)';c.beginPath();c.moveTo(90,830);c.lineTo(990,830);c.stroke();
  c.textAlign='left';c.fillStyle='#6E6A62';c.font='300 22px "Noto Serif SC"';c.fillText(V[verdict][0],90,890);
  c.fillStyle='#ECE8DF';c.font='500 66px "Noto Serif SC"';h.forEach((l,i)=>c.fillText(l,90,985+i*88));
  c.fillStyle='#B9B4A9';c.font='300 28px "Noto Serif SC"';c.fillText(p.catch,90,catchY);
  // 引力比例条 + 标签
  const barW=900,pullW=barW*pull;
  c.fillStyle='#9DB4D0';c.globalAlpha=.4;c.fillRect(90,barY,barW,3);c.globalAlpha=1;
  c.fillStyle='#E6DCC4';c.fillRect(90,barY,pullW,3);
  c.fillStyle='#6E6A62';c.font='300 22px "Noto Serif SC"';c.textAlign='left';c.fillText(T('gravity')(p.name,Math.round(pull*100)),90,barLabelY);
  c.textAlign='right';c.fillText(T('gravity2')(q.name,Math.round(100-pull*100)),990,barLabelY);
  // 分隔线 + mode + desc + traits
  c.strokeStyle='rgba(236,232,223,.12)';c.beginPath();c.moveTo(90,line2Y);c.lineTo(990,line2Y);c.stroke();
  c.fillStyle='#E6DCC4';c.font='400 34px "Noto Serif SC"';c.textAlign='left';c.fillText(p.mode,90,modeY);
  c.fillStyle='#B9B4A9';c.font='300 28px "Noto Serif SC"';c.textAlign='left';
  wText(c,p.desc||'',90,descY,900,48);
  // traits（琥珀色描边小标签）
  c.font='300 22px "Noto Serif SC"';c.textAlign='left';
  let tx=90;
  for(const t of(p.traits||[])){const tw=c.measureText(t).width;c.strokeStyle='rgba(233,163,91,.4)';c.lineWidth=1;c.strokeRect(tx,traitsY-30,tw+40,44);c.fillStyle='#E9A35B';c.fillText(t,tx+20,traitsY);tx+=tw+60;}
  // 二维码：右下角
  const qi=new Image();
  await new Promise(res=>{let d=false;const fin=()=>{if(d)return;d=true;res();};qi.onload=fin;qi.onerror=fin;qi.src=QR_FALLBACK;setTimeout(fin,3000);});
  const qrSize=180,qrX=W-qrSize-90,qrY=H-qrSize-140;
  c.fillStyle='#fff';c.fillRect(qrX-12,qrY-12,qrSize+24,qrSize+24);
  if(qi.complete&&qi.naturalWidth){try{c.drawImage(qi,qrX,qrY,qrSize,qrSize);}catch(e){}}
  c.fillStyle='#ECE8DF';c.font='400 22px "Noto Serif SC"';c.textAlign='center';c.fillText(T('qrFollow'),qrX+qrSize/2,qrY+qrSize+40);
  // 品牌行：左下角
  c.textAlign='left';c.fillStyle='#E9A35B';c.beginPath();c.arc(98,H-55,6,0,7);c.fill();
  c.fillStyle='#ECE8DF';c.font='500 26px "Noto Serif SC"';c.fillText(T('footBrand'),118,H-46);
  // 下载：toBlob 优先，失败 dataURL 兜底
  const dl=(url,rev)=>{const a=document.createElement('a');a.href=url;a.download=T('fileName')(p.name);document.body.appendChild(a);a.click();a.remove();if(rev)setTimeout(()=>URL.revokeObjectURL(url),4000);b.textContent=T('saved');setTimeout(()=>b.textContent=T('save'),2200);};
  try{cv.toBlob(bl=>{if(bl)dl(URL.createObjectURL(bl),true);else dl(cv.toDataURL('image/png'),false);},'image/png');}catch(e){dl(cv.toDataURL('image/png'),false);}
 }catch(err){console.error('share img failed:',err);b.textContent=T('saveFail');setTimeout(()=>b.textContent=T('save'),2800);}
}

/* ═══ 开场 / 续走 ═══ */
async function intro(){
 STAGE='intro';backBtn.hidden=true;
 atmos(DEMO?DATA().acts[0].palette:PUBPAL,1);reel('');
 const resume=load()&&S.i>0;
 const heroName=LANG==='en'?'Soul Coordinates':'灵魂坐标';const n=await show(`<div>${art("compass",'big',3)}<h1 class="hero">${heroName}<small>${T('heroSub')}</small></h1><p class="lead">${T('lead')}</p><p class="lead-hook">${T('leadHook')}</p><p class="meta">${T('meta')}</p><button class="go">${resume?T('resume'):T('start')}</button>${resume?`<button class="go" style="margin-top:14px;font-size:13px;color:var(--ink3)">${T('restart')}</button>`:''}</div>`);
 const gs=n.querySelectorAll('.go');
 const begin=async(fresh)=>{try{if(fresh||!resume){sessionStorage.removeItem('nl4');Object.assign(S,{acc:[0,0,0,0,0],path:[],i:0,n:0,paid:false,hist:[]});const r=await IO.session();render(r.step);}
   else if(DEMO){render(timeline(S.path)[S.i]?localRender(timeline(S.path)[S.i],S.n):null);}
   else{const r=await IO.session();render(r.step);}}catch(e){err(LANG==='en'?'Couldn\'t start. Check your connection and try again.':'\u6ca1\u80fd\u5f00\u59cb\u3002\u68c0\u67e5\u7f51\u7edc\u540e\u518d\u8bd5\u3002');}};
 gs[0].onclick=()=>begin(false);if(gs[1])gs[1].onclick=()=>begin(true);
}
/* 初始化 UI 文案 + 语言切换 */
function initUILabels(){
 const lt=$('#langtoggle');if(lt)lt.textContent=LANG==='en'?'中':'EN';
 const sb=$('#snd');if(sb&&!sb.getAttribute('aria-pressed').match('true'))sb.textContent=T('sndOff');
 document.documentElement.lang=LANG==='en'?'en':'zh';document.title='NomadLens \u6570\u5b57\u6e38\u6c11\u5b9e\u9a8c\u5ba4 \u00b7 '+(LANG==='en'?'Soul Coordinates':'\u7075\u9b42\u5750\u6807');
}
async function rerender(){
 initUILabels();
 if(STAGE==='result'){RESULT=null;window.__R=null;atmos(null,null,'res');await result();return;}
 if(STAGE==='flow'){const cur=timeline(S.path)[S.i];if(cur){const stp=localRender(cur,S.n);if(!DEMO&&S.progress!==undefined)stp.progress=S.n;await render(stp);}else{await intro();}return;}
 await intro();
}
$('#langtoggle').onclick=async()=>{if(busy)return;setLang(LANG==='en'?'zh':'en');await rerender();};
(async()=>{
 initUILabels();
 const m=location.pathname.match(/\/r\/([a-z0-9]+)/i);const back=new URLSearchParams(location.search).get('paid');
 if(!DEMO&&(m||back)){try{RESULT=await IO.result(m?m[1]:undefined);atmos(null,null,'res');await result();return;}catch(e){}}
 intro();
})();
</script>
